<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* ★ 낡은 서비스 워커가 이 페이지를 물고 있으면 스스로 지우고 한 번만 새로고침한다.
   "강력 새로고침 해주세요" "Unregister 눌러주세요" 안내를 계속 반복할 필요가 없도록. */
(function(){
  if('serviceWorker' in navigator && navigator.serviceWorker.controller && !sessionStorage.getItem('sw-cleared-v3')){
    sessionStorage.setItem('sw-cleared-v3','1');
    navigator.serviceWorker.getRegistrations().then(function(regs){
      return Promise.all(regs.map(function(r){ return r.unregister(); }));
    }).then(function(){ location.reload(); });
  }
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#E9ECE6">
<title>기출 해설 노트</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
/* ══════════════════════════════════════════════════════
   답안지(OMR) × 청사진 — 디자인 토큰
   ══════════════════════════════════════════════════════ */
:root{
  --paper:#E9ECE6;      /* 답안지 종이 */
  --card:#FCFCFA;       /* 문제 카드 */
  --ink:#10233D;        /* 본문 잉크 */
  --ink-2:#5A6B7F;      /* 보조 */
  --rule:#D3D8CD;       /* 괘선 */
  --stamp:#BE2B26;      /* 정답 도장 — 오직 정답에만 */
  --accent:#1D4ED8;     /* 조작 가능한 것 */
  --accent-soft:#E4ECFD;
  --veil:#C4433C;       /* 가림판 */
  --shadow:0 1px 0 rgba(16,35,61,.05), 0 6px 20px -14px rgba(16,35,61,.5);
  --r:14px;
  --head:56px;
  --rail:46px;
  --qhead:52px;   /* 문항 헤더(번호·제목·필기·별표) 고정 바 높이 */
  --font-d:"IBM Plex Sans KR",Pretendard,sans-serif;
  --font-b:Pretendard,"IBM Plex Sans KR",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,monospace;
}
html[data-theme="dark"]{
  --paper:#0E1520; --card:#161E29; --ink:#E3E9F1; --ink-2:#8A9AAE;
  --rule:#26303D; --stamp:#FF7A6E; --accent:#7BA2FF; --accent-soft:#1B2740;
  --veil:#8E322C;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -16px #000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-b);font-size:15px;line-height:1.62;
  letter-spacing:-.01em;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--accent);text-decoration:none}
.mono{font-family:var(--font-m);font-feature-settings:"tnum"}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── 상단 바 ─────────────────────────────────── */
.top{
  position:sticky;top:0;z-index:40;height:var(--head);
  padding:0 14px;padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);
}
.top h1{font:600 15px/1.2 var(--font-d);margin:0;letter-spacing:-.02em}
.top .sub{font-size:11px;color:var(--ink-2);margin-top:1px}
/* ★ 한 줄로 못 박고, 넘치면 «…» 로 자른다.
   이걸 안 걸어 두면 긴 제목이 바 높이를 넘어 아래 화면 위에 겹쳐 찍힌다. */
.top .grow{flex:1;min-width:0;overflow:hidden}
.top h1,.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.top .grow{cursor:pointer}
/* 눌러서 펼치면 두 줄까지 보여 준다 */
.top.wide{height:auto;min-height:var(--head);padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px}
.top.wide h1,.top.wide .sub{white-space:normal;overflow:visible;text-overflow:clip}
.top.wide .sub{line-height:1.4}
@media(max-width:520px){
  .top h1{font-size:14px}
  .top .sub{font-size:10.5px}
}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2)}
.icon:active{background:var(--accent-soft)}
.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── 화면 전환 ───────────────────────────────── */
.view{display:none;animation:in .22s ease both}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{padding:18px 14px 90px;max-width:760px;margin:0 auto}

/* ── 섹션 라벨: 실제 개수를 담는 괘선 ─────────── */
.eyebrow{
  display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;
  font:600 11px/1 var(--font-d);letter-spacing:.14em;color:var(--ink-2);
}
.eyebrow:first-child{margin-top:4px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
.eyebrow .n{font-family:var(--font-m);letter-spacing:0}

/* ── 과목 카드 ───────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
.subj{
  position:relative;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:14px 14px 12px;text-align:left;
  box-shadow:var(--shadow);transition:transform .12s,border-color .12s;
  display:flex;flex-direction:column;min-height:104px;
}
.subj:active{transform:scale(.98)}
.subj .tag{font:600 10px/1 var(--font-d);letter-spacing:.08em;color:var(--ink-2)}
.subj .nm{font:700 16px/1.3 var(--font-d);margin-top:8px;letter-spacing:-.03em;flex:1}
.subj .meta{font-family:var(--font-m);font-size:11px;color:var(--ink-2);margin-top:10px;display:flex;gap:8px}
.subj .bar{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}

/* ── 회차 행 ─────────────────────────────────── */
#reroll{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;
  padding:12px 16px;border-radius:999px;border:0;cursor:pointer;
  font:700 13px/1 var(--font-d);color:#fff;background:var(--accent);
  box-shadow:0 4px 14px -4px rgba(16,35,61,.5)}
#reroll:active{transform:scale(.95)}
#reroll[hidden]{display:none}
/* 전체보기 전환 — 다시 뽑기 바로 위에 같은 자리에 둔다 */
#mixall{position:fixed;right:14px;bottom:calc(62px + env(safe-area-inset-bottom));z-index:60;
  padding:10px 14px;border-radius:999px;cursor:pointer;
  font:700 12px/1 var(--font-d);color:var(--accent);background:var(--card);
  border:1.5px solid var(--accent);box-shadow:0 4px 14px -6px rgba(16,35,61,.4)}
#mixall.on{background:var(--accent);color:#fff}
#mixall:active{transform:scale(.95)}
#mixall[hidden]{display:none}
/* 한눈에 — 다시 뽑기·전체 보기 위에 같은 줄로 쌓는다.
   섞어 보기가 아닐 때는 이 단추만 뜨므로, 그때는 맨 아래로 내려온다. */
#glance{position:fixed;right:14px;bottom:calc(110px + env(safe-area-inset-bottom));z-index:60;
  padding:10px 14px;border-radius:999px;cursor:pointer;
  font:700 12px/1 var(--font-d);color:var(--ink);background:var(--card);
  border:1.5px solid var(--rule);box-shadow:0 4px 14px -6px rgba(16,35,61,.4)}
#glance.solo{bottom:calc(14px + env(safe-area-inset-bottom))}
#glance:active{transform:scale(.95)}
#glance[hidden]{display:none}
body.gvlopen #glance,body.gvlopen #mixall,body.gvlopen #reroll,
body.gvlopen .edgenav,body.gvlopen .hlbar{display:none !important}

/* ── 한눈에 보기 판 ── */
.gvl{position:fixed;inset:0;z-index:300;background:var(--paper);display:none;
  flex-direction:column;padding-top:env(safe-area-inset-top)}
.gvl.on{display:flex}
body.gvlopen{overflow:hidden}
.gvl .gh{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);background:var(--card)}
.gvl .gt{font:700 13.5px/1.3 var(--font-d);letter-spacing:-.01em;margin-right:auto;
  display:flex;align-items:center;gap:8px;min-width:0}
.gvl .gt small{font:500 11px/1 var(--font-m);color:var(--ink-2);white-space:nowrap}
.gvl .gb{padding:8px 12px;border-radius:9px;border:1.3px solid var(--rule);
  background:var(--card);color:var(--ink);font:600 12px/1 var(--font-d);cursor:pointer}
.gvl .gb.pick{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gvl .gb:disabled{opacity:.4}
.gvl .gb2{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:1px;background:var(--rule);overflow:hidden}
.gvl .gpane{background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.gvl .glab{font:600 10.5px/1 var(--font-d);letter-spacing:.14em;color:var(--ink-2);
  display:flex;align-items:center;gap:8px;position:sticky;top:-12px;z-index:2;
  background:var(--paper);padding:6px 0 7px;margin:-6px 0 0}
.gvl .glab::after{content:"";flex:1;height:1px;background:var(--rule)}
.gvl .gtabs{display:none;gap:5px;padding:7px 12px;border-bottom:1px solid var(--rule);background:var(--card)}
.gvl .gtabs button{flex:1;padding:9px 6px;border-radius:8px;font:600 12.5px/1 var(--font-d);
  background:transparent;border:1.3px solid var(--rule);color:var(--ink-2);cursor:pointer}
.gvl .gtabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gvl .miss{font-size:12.5px;color:var(--ink-2);padding:18px 0;text-align:center}
.gvl .gq{font-size:15px;line-height:1.62}
.gvl .gch{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;
  border:1px solid var(--rule);background:var(--card);font-size:14px;margin-bottom:5px}
.gvl .gch.ok{border-color:var(--stamp);background:color-mix(in srgb,var(--stamp) 8%,transparent)}
.gvl .gch .b{font:700 11px/1.5 var(--font-m);color:var(--ink-2);flex:none;
  width:19px;height:19px;border-radius:50%;border:1px solid var(--rule);text-align:center}
.gvl .gch.ok .b{background:var(--stamp);border-color:var(--stamp);color:#fff}
.gvl img{max-width:100%;height:auto;display:block;border:1px solid var(--rule);border-radius:9px;background:#fff}
@media(max-width:900px){
  .gvl .gb2{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .gvl .gtabs{display:flex}
  .gvl .gpane.right > .gseg{display:none}
  .gvl .gpane.right > .gseg.on{display:block}
}
@media(min-width:1500px){
  .gvl .gb2{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1fr)}
  .gvl .gpane.right{display:contents}
  .gvl .gpane.right > .gseg{background:var(--paper);overflow:auto;padding:12px 14px}
}
/* ── 과목 고르는 칩 ──
   과목 카드는 «들어가는 문» 이고, 이 칩은 «섞을 재료를 고르는 것» 이다.
   생김새를 다르게 해야 헷갈리지 않는다. */
.pickbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.pickb{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;
  border:1.4px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer;
  font:600 12.5px/1 var(--font-d);min-height:36px;transition:border-color .15s,background .15s}
.pickb .qn{font:500 10.5px/1 var(--font-m);opacity:.7}
.pickb .dotc{width:8px;height:8px;border-radius:50%;background:var(--sc,#1D4ED8);flex:none;opacity:.35}
.pickb.on{border-color:var(--sc,#1D4ED8);background:color-mix(in srgb,var(--sc,#1D4ED8) 9%,transparent);
  color:var(--ink)}
.pickb.on .dotc{opacity:1}
.pickall{margin-left:4px;border-style:dashed}
.picktip{font-size:12px;color:var(--ink-2);margin:-6px 0 12px}
/* 과목을 하나도 안 골랐을 때는 아래 단추들만 흐리게 죽인다.
   ★ 과목 «고르는 칩(#pickBar)» 은 이 상자 «바깥» 에 있어야 한다.
     안에 두면 아무것도 안 고른 상태에서 칩까지 같이 죽어,
     첫 과목을 영영 고를 수 없게 된다. (실제로 그랬다) */
#multiWrap.off{opacity:.42;pointer-events:none}
.mixbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:7px;margin:4px 0 8px}
/* 한 번에 몇 문항을 뽑을지 — 위 다섯 단추 모두에 함께 걸린다 */
.sizebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.sizebar .lbl{font:600 11px/1 var(--font-d);letter-spacing:.05em;color:var(--ink-2);margin-right:2px}
.szb{font:600 11.5px/1 var(--font-m);padding:8px 10px;border-radius:8px;cursor:pointer;
  border:1.3px solid var(--rule);background:var(--card);color:var(--ink-2)}
.szb.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.szb:active{transform:scale(.95)}
.mixb{padding:12px 8px;border-radius:11px;border:1.5px solid var(--rule);background:var(--card);
  font:700 12.5px/1.2 var(--font-d);color:var(--ink);cursor:pointer}
.mixb:active{transform:scale(.97)}
.mixb.rnd{border-color:var(--accent);color:var(--accent)}
.mixb.g{border-color:#C79A16;color:#946F06;background:#FDF6E3}
.mixb.s{border-color:#9AA6B2;color:#5E6C7A;background:#F2F4F6}
.mixb.b{border-color:#B98A63;color:#8A5F3C;background:#FAF1E9}
.mixb.r{border-color:var(--rule);color:var(--ink-2)}
.mixb .c{display:block;font:500 10.5px/1 var(--font-m);opacity:.75;margin-top:5px}
.mixnote{font-size:11.5px;color:var(--ink-2);line-height:1.7;margin:0 0 16px}
.mixnote b{color:var(--ink);font-weight:600}

/* ── 시험 정보 · 출제경향 ── */
.infob{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--rule);
  background:var(--card);color:var(--ink);font:600 12.5px/1 var(--font-d);cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.infob .arw{color:var(--ink-2);font:500 11px/1 var(--font-m);transition:transform .15s}
.infob.on{border-color:var(--accent);color:var(--accent)}
.infob.on .arw{transform:rotate(180deg);color:var(--accent)}
.infopanel{display:none;margin:0 0 14px;padding:14px;border-radius:12px;
  background:var(--card);border:1px solid var(--rule)}
.infopanel.on{display:block}
.infopanel h4{font:600 12px/1 var(--font-d);letter-spacing:.06em;color:var(--ink-2);
  margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.infopanel section + section{margin-top:18px}
.infopanel p{margin:0 0 8px;font-size:12px;line-height:1.75;color:var(--ink-2)}
.infopanel p b{color:var(--ink);font-weight:600}
.era{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:12px}
.era:first-of-type{border-top:0}
.era .lab{flex:none;width:104px;font:600 11.5px/1.5 var(--font-m);color:var(--ink)}
.era .txt{flex:1;color:var(--ink-2);line-height:1.6}
.era.now .lab{color:var(--accent)}
.flag{display:inline-block;font:600 10px/1 var(--font-d);padding:3px 6px;border-radius:5px;
  background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);margin-left:5px}
.gapline{font:400 11.5px/1.7 var(--font-m);color:var(--ink-2)}
.gapline b{color:var(--ink);font-weight:600}
.gapline .miss{color:var(--stamp)}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topic{font:500 11.5px/1 var(--font-d);padding:7px 9px;border-radius:8px;
  background:var(--paper);border:1px solid var(--rule);color:var(--ink)}
.topic i{font-style:normal;color:var(--ink-2);font-family:var(--font-m);font-size:10.5px;margin-left:5px}
.barrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px}
.barrow .nm{flex:none;width:118px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .tr{flex:1;height:7px;border-radius:4px;background:var(--paper);overflow:hidden}
.barrow .fl{height:100%;background:var(--accent);border-radius:4px}
.barrow .vv{flex:none;font:500 10.5px/1 var(--font-m);color:var(--ink-2);width:44px;text-align:right}

/* ── 핵심개념 자료 ── */
.note{border:1px solid var(--rule);border-radius:10px;margin-bottom:8px;
  background:var(--paper);overflow:hidden}
.note>summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;
  align-items:center;gap:9px;font:600 12.5px/1.4 var(--font-d)}
.note>summary::-webkit-details-marker{display:none}
.note>summary::after{content:"▾";margin-left:auto;color:var(--ink-2);font-size:11px;transition:transform .15s}
.note[open]>summary::after{transform:rotate(180deg)}
.note[open]>summary{background:var(--card)}
.note .ni{flex:none;min-width:22px;height:22px;padding:0 5px;display:grid;place-items:center;
  border-radius:6px;background:var(--ink);color:var(--paper);font:600 11px/1 var(--font-m)}
.note .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .nk{flex:none;font:500 10px/1 var(--font-m);color:var(--ink-2);
  padding:3px 6px;border:1px solid var(--rule);border-radius:5px;background:var(--card)}
.nb{padding:0 12px 12px;background:var(--card);border-top:1px solid var(--rule)}
.nb img{display:block;width:100%;height:auto;margin-top:12px;border-radius:8px;
  border:1px solid var(--rule);background:#fff}
.nb iframe{display:block;width:100%;height:70vh;margin-top:12px;border-radius:8px;
  border:1px solid var(--rule);background:#fff}
.nbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
.noteadd{display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--rule)}

/* ── 즐겨찾기 자료 바로 보기 ──────────────────────────────────
   문제를 풀다 주기율표를 확인하려고 과목 화면까지 나갔다 오면 풀던 흐름이 끊긴다.
   그래서 지금 화면 위에 덮어 띄우고, 닫으면 있던 자리에 그대로 남는다. */
.qnote{width:32px;height:32px;flex:none;display:none;place-items:center;border-radius:9px;
  color:var(--ink-2);background:transparent;border:0;cursor:pointer}
body.haspin .qnote{display:grid}
.qnote svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.qnote.on{background:var(--accent);color:#fff}

.noteov{position:fixed;inset:0;z-index:90;display:none;
  background:color-mix(in srgb,var(--ink) 55%,transparent);
  backdrop-filter:blur(2px);padding:calc(10px + env(safe-area-inset-top)) 10px 10px}
.noteov.on{display:flex;flex-direction:column}
.noteov-card{flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden;
  max-width:1100px;width:100%;margin:0 auto;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.noteov-bar{flex:none;display:flex;align-items:center;gap:7px;padding:9px 10px;
  border-bottom:1px solid var(--rule);background:var(--paper);overflow-x:auto}
.noteov-bar .ntab{flex:none;padding:8px 11px;border-radius:9px;border:1.3px solid var(--rule);
  background:var(--card);color:var(--ink-2);font:600 12px/1 var(--font-d);cursor:pointer;white-space:nowrap}
.noteov-bar .ntab.on{border-color:var(--accent);color:var(--accent)}
.noteov-bar .x{margin-left:auto;flex:none;padding:8px 12px;border-radius:9px;
  background:var(--ink);color:var(--paper);font:600 12px/1 var(--font-d);border:0;cursor:pointer}
.noteov-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--paper);padding:10px;text-align:center}
.noteov-body img{display:block;width:100%;max-width:none;height:auto;border-radius:8px;background:#fff}
.noteov-body iframe{display:block;width:100%;height:100%;min-height:70vh;border:0;background:#fff}
.noteov-body .zoomhint{font:500 11px/1.6 var(--font-d);color:var(--ink-2);margin:8px 0 0}

/* ── 비전공자용 상세 설명 — 기존 해설에 그대로 이어 붙는다 ──
   따로 접어 두면 "펼쳐야 나오는 부록"이 되어 읽는 흐름이 끊긴다.
   해설을 읽다가 막히는 자리에서 그대로 이어지도록 같은 글줄 안에 둔다. */
.easy{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--rule)}
.easy .ez-h{font:600 11px/1 var(--font-d);letter-spacing:.1em;color:var(--accent);
  margin-bottom:11px;display:flex;align-items:center;gap:8px}
.easy .ez-h::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--accent) 25%,transparent)}
.easy .eb{font-size:13.5px;line-height:1.6}
.easy .eb h3{font:600 13px/1.4 var(--font-d);margin:13px 0 4px;color:var(--ink)}
.easy .eb h2{font:600 13.5px/1.4 var(--font-d);margin:15px 0 5px;color:var(--ink)}
.easy .eb h2:first-child,.easy .eb h3:first-child{margin-top:0}
.easy .eb p{margin:0 0 6px}
.easy .eb ul,.easy .eb ol{margin:0 0 6px;padding-left:18px}
.easy .eb li{margin-bottom:2px}
.easy .eb table{margin:5px 0 8px}
.easy .ebar{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.easy .wait{font:500 12px/1.6 var(--font-d);color:var(--ink-2)}
.year{font:600 13px/1 var(--font-m);color:var(--ink-2);margin:20px 0 8px;letter-spacing:.04em}
.rows{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
  text-align:left;box-shadow:var(--shadow);transition:transform .12s;
}
.row:active{transform:scale(.99)}
.row .no{white-space:nowrap;font:600 14px/1 var(--font-m);min-width:34px;flex:none}
.row .ttl{flex:1;font-size:14px;font-weight:500}
.row .cnt{font-family:var(--font-m);font-size:11px;color:var(--ink-2)}
.row .chev{color:var(--ink-2);opacity:.6}
.row .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}

/* ══ 문항 번호 레일 — 답안지 마킹칸 ══════════════ */
.rail{
  position:sticky;top:calc(var(--head) + env(safe-area-inset-top));z-index:30;
  height:var(--rail);display:flex;align-items:center;gap:5px;
  padding:0 12px;overflow-x:auto;scrollbar-width:none;
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);
}
/* 문항이 많으면(합본처럼 200문항 넘어가면) 한 줄로는 끝없이 밀어야 한다.
   두 줄로 접어 스크롤 길이를 절반으로 줄인다. */
.rail.two{
  height:calc(var(--rail) * 1.75);
  display:grid;grid-auto-flow:column;grid-template-rows:repeat(2, 1fr);
  align-content:center;justify-items:center;   /* 늘리지 말고 가운데에 둔다 */
  gap:4px 5px;padding-top:4px;padding-bottom:4px;
}
.rail::-webkit-scrollbar{display:none}
.bub{
  flex:none;position:relative;
  /* 세 자리(101…)가 되면 글자가 동그라미를 꽉 채워 가운데를 벗어나 보인다.
     그래서 그 회차의 가장 큰 번호 자릿수에 맞춰 모든 동그라미 폭을 한 값으로 맞춘다. */
  min-width:var(--bubw, 28px);width:var(--bubw, auto);
  height:28px;padding:0 4px;box-sizing:border-box;text-align:center;
  border-radius:999px;border:1.4px solid var(--rule);
  /* 아직 안 본 번호도 읽을 수 있어야 한다. 예전에는 연한 회색이라
     200개가 뿌옇게 깔려 어디가 어딘지 분간이 안 됐다. */
  font:500 12px/1 var(--font-m);color:var(--ink);
  background:#fff;
  display:grid;place-items:center;transition:all .16s;
}
/* 본 문항이라고 흐리게 만들지 않는다 — 번호는 늘 같은 흰 바탕에 또렷하게.
   테두리만 살짝 진해져서 "봤다"는 표시만 남는다. */
.bub.seen{border-color:color-mix(in srgb,var(--ink) 32%,transparent)}
/* 10의 배수에 굵은 테두리 — 200개 넘어가면 눈금이 있어야 위치를 잡는다 */
.bub.tick{border-color:color-mix(in srgb,var(--accent) 45%,transparent);font-weight:700}

/* 10문항 칸막이 */
.rail .sep{flex:none;width:1px;align-self:center;height:20px;margin:0 4px;
  background:color-mix(in srgb,var(--ink) 22%,transparent)}
.rail .sep.big{width:2px;height:26px;border-radius:1px;position:relative;
  background:color-mix(in srgb,var(--accent) 55%,transparent)}
/* 50·100·150… 자리에는 숫자를 얹어 둔다. 200문항짜리에서 위치를 단번에 잡는다 */
.rail .sep.big::after{content:attr(data-n);position:absolute;top:-2px;left:4px;
  font:700 8.5px/1 var(--font-m);color:color-mix(in srgb,var(--accent) 75%,transparent);
  letter-spacing:-.02em;pointer-events:none}
.rail.two .sep.big::after{top:1px}
/* 두 줄일 때는 위아래를 가로지르게 */
.rail.two .sep{grid-row:1 / span 2;align-self:stretch;height:auto;margin:2px 4px}
.rail.two .sep.big{margin:0 4px}
.bub.ink::before{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  width:10px;height:2px;border-radius:2px;background:var(--accent)}
.bub.star::after{
  content:"";position:absolute;top:-1px;right:-1px;width:6px;height:6px;
  border-radius:50%;background:var(--stamp);
}
.bub.now{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}

/* ── 스와이프 트랙 ───────────────────────────── */
.track{
  display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;
  height:calc(100dvh - var(--head) - var(--rail) - env(safe-area-inset-top));
  overscroll-behavior-x:contain;
}
.track::-webkit-scrollbar{display:none}
.slide{
  flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;
  overflow-y:auto;overscroll-behavior-y:contain;
  /* 태블릿에서 아래쪽 도구모음이 마지막 줄을 덮는 일이 있어 여유를 넉넉히 둔다 */
  padding:0 14px calc(96px + env(safe-area-inset-bottom));
}
.sheet-body{max-width:760px;margin:0 auto}

/* ══ 화면 배치 3가지 ═══════════════════════════════════════
   ① swipe-x (기본) : 좌우로 밀어 다음 문항. 지금까지 쓰던 방식.
   ② swipe-y        : 위아래로 밀어 다음 문항. 한 손으로 엄지만 써서 넘길 때 편하다.
   ③ split          : 화면을 좌우로 갈라 왼쪽엔 문제, 오른쪽엔 해설.
                      해설이 길어도 문제를 계속 보면서 읽을 수 있다.
                      화면이 좁으면(<900px) 의미가 없으므로 자동으로 한 단으로 돌아간다. */

/* ② 세로 넘김 — 트랙을 세로로 세우고 스냅 축만 바꾼다 */
.track.vert{
  flex-direction:column;
  overflow-x:hidden;overflow-y:auto;
  scroll-snap-type:y mandatory;
  overscroll-behavior-y:contain;overscroll-behavior-x:auto;
}
.track.vert .slide{
  flex:0 0 100%;
  height:calc(100dvh - var(--head) - var(--rail) - env(safe-area-inset-top));
}

/* ③ 좌우 2단 — 문제 카드와 해설을 나란히 */
@media(min-width:900px){
  .split .sheet-body{max-width:1400px}
  .split .splitcols{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:16px;align-items:start;
  }
  /* 두 칸 각각이 따로 스크롤된다 — 해설을 내려도 문제는 그대로 보인다.
     높이를 dvh 로 계산하면 태블릿에서 주소창·도구모음이 접혔다 펴질 때 실제 보이는
     높이와 어긋나, 칸이 화면 밖으로 삐져나가 아래쪽 해설에 손이 닿지 않는다.
     그래서 --colh 를 JS 가 실제로 재서 넣어 준다. dvh 계산은 그게 없을 때의 보험이다.
     overscroll 도 contain 대신 풀어 둔다 — 칸 끝에서 더 밀면 슬라이드가 이어서 밀리므로
     혹시 칸 높이가 어긋나도 내용이 갇히지 않는다. */
  .split .splitcols > *{
    max-height:var(--colh, calc(100dvh - var(--head) - var(--rail) - var(--qhead) - 40px));
    overflow-y:auto;overscroll-behavior:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:32px;
  }
  .split .splitcols > *::-webkit-scrollbar{width:6px}
  .split .splitcols > *::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
  /* 필기 중인 문항은 좌표계가 고정폭 가상 페이지(400px)라 2단으로 쪼개면 잉크가 어긋난다.
     그래서 필기가 올라간 문항은 2단을 적용하지 않고 한 단 그대로 둔다. */
  .split .inkpage .splitcols{display:block}
  .split .inkpage .splitcols > *{max-height:none;overflow:visible}
}

/* ── 문항 헤더 ───────────────────────────────── */
/* 슬라이드를 아래로 스크롤해도 번호·제목·필기·별표 바는 위에 계속 붙어 있는다.
   .slide 가 세로 스크롤 컨테이너이므로, 그 안에서 sticky top:0 이면 스크롤포트 맨 위에 고정된다.
   ★ 위 여백을 마이너스 마진으로 상쇄하면 안 된다 — sticky 는 "마진 박스"를 기준으로 붙기 때문에
     그만큼 바가 아래로 밀리고 그 틈으로 카드 윗부분(2과목 …)이 비쳐 보인다.
     그래서 .slide 의 위 여백 자체를 0 으로 두고, 이 바가 첫 요소로서 여백 역할까지 겸한다.
   좌우 -14px 은 .slide 의 좌우 여백만 상쇄해 바가 화면 폭을 꽉 채우게 만든다. */
.qhead{
  position:sticky;top:0;z-index:28;
  display:flex;align-items:center;gap:10px;
  height:var(--qhead);flex:none;
  margin:0 -14px 10px;padding:0 14px;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
}

/* ══ 필기 ═══════════════════════════════════════════════ */
.qink{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:9px;color:var(--ink-2)}
.qink svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qink.has{color:var(--accent)}
.qink.on{background:var(--accent);color:#fff}

/* 고정폭 가상 페이지: 여기 안에서는 절대 다시 줄바꿈되지 않는다.
   폭이 바뀌면(회전 등) 이 블록 통째로 scale() 되므로 글자와 잉크가 항상 같이 움직인다 */
.inkwrap{position:relative;overflow:hidden;border-radius:var(--r);box-shadow:var(--shadow);
         background:var(--card);border:1px solid var(--rule)}

/* ══ 두 손가락 핀치 확대 ═══════════════════════════════════
   zoomstage 를 CSS zoom 으로 키운다(transform 이 아니라 zoom).
   zoom 은 실제 레이아웃 크기를 바꾸므로, 안쪽의 필기 캔버스가
   쓰는 auto-fit 배율(factor = 부모폭/400) 도 자동으로 같이 커진다 —
   그래서 확대해도 글자와 잉크가 같은 비율로 같이 커진다. */
.zoomwrap{position:relative;overflow:hidden;touch-action:pan-y}
.zoomstage{transform-origin:0 0;will-change:transform}
.zoomreset{display:none;position:absolute;top:8px;right:8px;z-index:25;
  padding:6px 11px;border-radius:999px;background:var(--ink);color:var(--paper);
  font:600 11px/1 var(--font-m);box-shadow:var(--shadow);letter-spacing:.02em}
.zoomwrap.zoomed .zoomreset{display:block}
.inkpage{width:400px;transform-origin:top left;position:relative;padding:16px}
.inkpage .qhead{padding:0}
.inkcanvas{position:absolute;inset:0;width:400px;touch-action:none;transform-origin:top left}
.inkcanvas.edit{cursor:crosshair}
/* 이동(손) 모드: 캔버스가 터치를 안 받고 그대로 통과시키므로 평소처럼 스크롤·스와이프·핀치가 된다.
   확대돼 있을 때는 한 손가락 드래그로 화면을 끌어서 옮긴다(포토샵 손도구와 같은 감각). */
.zoomwrap.panmode{cursor:grab}
.zoomwrap.panmode:active{cursor:grabbing}

/* 도구모음도 문항 헤더 바로 밑에 고정 — 아래쪽 해설을 필기하는 중에도 도구를 바꿀 수 있다.
   모바일 세로 화면에서는 두 줄(윗줄 = 도구, 아랫줄 = 색·되돌리기·닫기)로 나눠 버튼이 안 잘리게 한다.
   가로로 눕히거나 화면이 넓으면 한 줄로 합친다. */
.inktools{position:sticky;top:var(--qhead);z-index:27;
  display:flex;flex-direction:column;gap:6px;
  margin:0 -14px 0;padding:8px 14px;
  border-bottom:1px solid var(--rule);
  background:color-mix(in srgb,var(--card) 96%,var(--paper))}
.itrow{display:flex;align-items:center;gap:5px;min-width:0;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.itrow::-webkit-scrollbar{display:none}
@media(min-width:640px){
  .inktools{flex-direction:row;align-items:center;gap:8px}
  .itrow{flex:0 1 auto}
  .itrow.tools{flex:none}
}
.itbtn{flex:none;height:30px;padding:0 9px;border-radius:8px;border:1.4px solid var(--rule);
  font:600 11.5px/1 var(--font-d);color:var(--ink-2);display:flex;align-items:center;gap:5px}
.itbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.itbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.itsep{width:1px;align-self:stretch;background:var(--rule);margin:0 2px}
.itcolor{width:22px;height:22px;border-radius:50%;border:2px solid transparent;flex:none}
.itcolor.on{border-color:var(--ink)}
.itgrow{flex:1}
.itsave{flex:none;font:500 10.5px/1 var(--font-m);color:var(--ink-2);white-space:nowrap;margin-left:6px}

/* 펜 투명도 슬라이더 — 형광펜처럼 옅게, 또는 완전히 진하게 */
.itopa{display:flex;align-items:center;gap:6px;flex:none;
  padding:0 8px;height:30px;border-radius:8px;border:1.4px solid var(--rule)}
.itopa label{font:600 10.5px/1 var(--font-d);color:var(--ink-2);white-space:nowrap;margin:0}
.itopa input[type=range]{width:74px;accent-color:var(--accent);margin:0}
.itopa .val{font:500 10.5px/1 var(--font-m);color:var(--ink-2);width:30px;text-align:right}

/* ══ F9 가림막 — 누르면 화면이 즉시 흰색으로 덮인다 ══════════
   자리를 비울 때 어깨너머로 보이지 않게 하는 용도.
   아무 키나 누르거나 화면을 누르면 원래대로 돌아온다. */
#blank{
  position:fixed;inset:0;z-index:9999;display:none;
  background:#fff;
}
#blank.on{display:block}
#blank .tip{
  position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
  font:500 11px/1 var(--font-m);color:#D8D8D8;letter-spacing:.04em;user-select:none;
}
html[data-theme="dark"] #blank{background:#fff}

/* ── 로그인 팝오버(필기용) ── */
.inkauth{position:relative}
.inkpop{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;width:250px;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:14px}
.inkpop.on{display:block}
.inkpop input{width:100%;padding:9px 10px;border:1.4px solid var(--rule);border-radius:8px;
  background:var(--paper);color:var(--ink);font:inherit;font-size:13px;margin-bottom:7px}
.inkpop button{width:100%;padding:9px;border:0;border-radius:8px;background:var(--ink);
  color:var(--paper);font:600 13px/1 var(--font-d)}
.inkpop .hint{font-size:11px;color:var(--ink-2);margin-top:8px;line-height:1.5}
.inkpop .err{font-size:11.5px;color:var(--stamp);margin-top:6px}

.qno{font:600 13px/1 var(--font-m);color:var(--paper);background:var(--ink);
     padding:6px 9px;border-radius:7px;letter-spacing:.02em}
.qsum{flex:1;font-size:12px;color:var(--ink-2);font-weight:500;min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qstar{width:32px;height:32px;display:grid;place-items:center;color:var(--ink-2)}
.qstar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.qstar.on{color:var(--stamp)}
.qstar.on svg{fill:currentColor}

/* ── 정리 모드 — 로그인 + 스위치를 켰을 때만 보이는 삭제 단추 ── */
.delx{display:none;flex:none;align-items:center;justify-content:center;
      padding:5px 9px;border-radius:8px;background:transparent;
      border:1.3px solid var(--stamp);color:var(--stamp);
      font:600 11px/1 var(--font-d);white-space:nowrap;cursor:pointer}
.delx:active{background:color-mix(in srgb,var(--stamp) 12%,transparent)}
body.manage .delx{display:inline-flex}
.delx.wipe{border-color:var(--ink-2);color:var(--ink-2)}
.subj .delx,.row .delx{margin-left:6px}
.qhead .delx{margin-left:2px}

/* ── 문제 카드 ───────────────────────────────── */
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
       padding:16px;box-shadow:var(--shadow)}
.qtext{font-size:15px;line-height:1.65;font-weight:500;word-break:keep-all}
@media(max-width:520px){ .qtext{font-size:14.5px;line-height:1.62} }
@media(min-width:1100px){ .qtext{font-size:15.5px} }
.part{font:600 10px/1 var(--font-d);letter-spacing:.1em;color:var(--ink-2);margin-bottom:9px}

/* ── 보기 = OMR 마킹 ─────────────────────────── */
.choices{margin-top:16px;display:flex;flex-direction:column;gap:2px}
.ch{display:flex;gap:11px;align-items:flex-start;padding:9px 8px;border-radius:9px}
.ch .b{
  flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);
  font:500 11px/1 var(--font-m);display:grid;place-items:center;color:var(--ink-2);
  margin-top:1px;transition:all .2s;
}
.ch .t{flex:1;font-size:14.5px;line-height:1.6}
.ch.ok .b{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:600}
.ch.ok .t{font-weight:600}
.ch.ok{background:color-mix(in srgb,var(--stamp) 7%,transparent)}
.veiled .ch.ok .b{background:none;border-color:var(--rule);color:var(--ink-2);font-weight:500}
.veiled .ch.ok .t{font-weight:400}
.veiled .ch.ok{background:none}

/* ══ 가림판 — 이 앱의 서명 동작 ═══════════════════
   해설을 display:none 시키지 않고, 빨간 가림판이
   내려앉는 것처럼 덮는다. 눌러서 이 문항만 살짝 들추기. */
.answer{margin-top:14px;position:relative}
.answer .inner{transition:opacity .26s ease,transform .26s ease,filter .26s ease}
.veiled .answer{min-height:58px}
.veiled .answer .inner{
  opacity:0;transform:translateY(-8px) scale(.995);filter:blur(3px);
  pointer-events:none;height:0;overflow:hidden;
}
.cover{
  display:none;position:absolute;inset:0;height:58px;width:100%;
  border-radius:12px;border:1px dashed color-mix(in srgb,var(--veil) 55%,transparent);
  background:color-mix(in srgb,var(--veil) 9%,var(--card));
  color:var(--veil);font:600 12.5px/1 var(--font-d);letter-spacing:-.01em;
  align-items:center;justify-content:center;gap:7px;
}
.veiled .cover{display:flex}
.cover svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.slide.peek .answer .inner{opacity:1;transform:none;filter:none;pointer-events:auto;height:auto;overflow:visible}
.slide.peek .answer{min-height:0}
.slide.peek .cover{display:none}
.slide.peek .ch.ok .b{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:600}
.slide.peek .ch.ok{background:color-mix(in srgb,var(--stamp) 7%,transparent)}
.slide.peek .ch.ok .t{font-weight:600}

/* ── 해설 본문 ───────────────────────────────── */
.exp{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
     padding:16px;box-shadow:var(--shadow)}
.exp-h{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--font-d);
       letter-spacing:.12em;color:var(--ink-2);margin-bottom:12px}
.exp-h::after{content:"";flex:1;height:1px;background:var(--rule)}
/* 해설은 «읽는 글» 이라 문제 본문보다 한 눈금 작고 촘촘한 게 읽기 편하다.
   1.75 줄간격은 문단이 흩어져 보여 눈이 다음 줄을 놓친다. */
.exp-b{font-size:13.5px;line-height:1.6}
.exp-b p{margin:0 0 7px}
.exp-b ul,.exp-b ol{margin:0 0 7px;padding-left:18px}
.exp-b li{margin:2px 0}
.exp-b strong{font-weight:700;color:var(--ink)}
.exp-b code{font-family:var(--font-m);font-size:.9em;background:var(--accent-soft);
            padding:1px 5px;border-radius:4px}
.exp-b hr{border:0;border-top:1px solid var(--rule);margin:14px 0}
/* 기존 도구가 만든 통짜 시트 HTML 수용 */
.sheet-host{overflow-x:auto}
.sheet-host .sheet{background:transparent!important;box-shadow:none!important;
                   border:0!important;padding:0!important;margin:0!important;
                   max-width:100%!important;width:auto!important}
.sheet-host img,.sheet-host svg{max-width:100%;height:auto}
.sheet-host table{width:100%;border-collapse:collapse;font-size:13px}
.mdtable{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.mdtable table{border-collapse:collapse;width:100%;font-size:13.5px}
.mdtable th,.mdtable td{border:1px solid var(--rule);padding:6px 9px;text-align:left;white-space:nowrap}
.mdtable th{background:var(--accent-soft);font-weight:600;color:var(--ink)}
.mdtable td:first-child{white-space:normal;font-weight:500}
html[data-theme="dark"] .sheet-host{filter:invert(.92) hue-rotate(180deg)}
html[data-theme="dark"] .sheet-host img{filter:invert(1) hue-rotate(180deg)}
/* ══ 수식은 «같은 크기» 여도 작아 보인다 ══
   KaTeX 는 서양 활자(Computer Modern) 계열이라 글자 높이(x-height)가 낮고
   좌우 여백이 넓다. 한글(Pretendard)은 네모 칸을 거의 꽉 채운다.
   그래서 font-size 가 같아도 수식이 한 눈금 작아 보인다.
   1.02em 로는 모자라서, 눈으로 맞춘 값(1.14em)까지 올린다.

   폰에서는 여기에 더해 «바닥» 을 정해 둔다. 본문을 13px 로 줄이면
   수식은 15px 밑으로 내려가는데, 그 크기의 아래첨자는 사실상 안 보인다. */
.katex{font-size:max(1.22em, 16px)}
/* 따로 떨어져 있는 수식은 한 줄을 통째로 쓰므로 조금 더 키워도 된다 */
.katex-display > .katex{font-size:max(1.28em, 17px)}

/* ★ 같은 px 이어도 수식이 더 작아 보이는 이유.
   KaTeX 가 쓰는 Computer Modern 은 한글 본문(Pretendard)보다
   x-높이(소문자 몸통 높이)가 낮고 획이 가늘다. 그래서 «13px 대 13px» 로 맞춰 놔도
   눈에는 수식이 한 눈금 작게 들어온다. 배수만으로는 안 맞고 «바닥값» 이 필요하다.

   해설·쉬운 풀이는 본문을 13.5px 로 줄여 놓았으므로,
   1.22배를 곱해도 16.5px 밖에 안 된다. 그 크기의 분수·아래첨자는 흐릿하다.
   그래서 이 두 자리에는 바닥을 따로 더 올려 둔다. */
.exp-b .katex, .easy .eb .katex, .mkb .katex{font-size:max(1.26em, 16.5px)}
.exp-b .katex-display > .katex,
.easy .eb .katex-display > .katex{font-size:max(1.3em, 17.5px)}

/* 아래첨자·위첨자는 본문의 0.7배로 줄어든다. 수식 전체를 키워도
   Iₐ 의 a 는 여전히 10px 언저리라 폰에서 뭉개진다. 여기만 따로 받쳐 준다. */
.katex .msupsub{font-size:1.1em}
.katex .mfrac .frac-line{border-bottom-width:.06em}   /* 분수선이 가늘어 안 보이던 것 */
/* 루트 기호와 괄호도 획이 가늘어 배경에 묻힌다 */
.katex .sqrt > .sqrt-line{border-top-width:.055em}

/* 유니코드 아래첨자(I₁ · Vₐ)로 쓴 글도 같은 문제를 겪는다.
   KaTeX 가 아니라 그냥 글자라 브라우저가 0.75배로 줄여 버린다. */
sub,sup{font-size:.8em;line-height:0}
sub{bottom:-.22em}

@media(max-width:520px){
  .katex{font-size:max(1.24em, 16px)}
  .katex-display > .katex{font-size:max(1.28em, 16.5px)}
  .exp-b .katex, .easy .eb .katex, .mkb .katex{font-size:max(1.28em, 16.5px)}
}
/* 긴 수식은 좌우로 밀어 볼 수 있게 두되, 스크롤 막대는 감춘다.
   안 감추면 안드로이드 크롬에서 회색 가로 막대가 수식 아래에 늘 그려져
   "수식에 줄이 그어진 것"처럼 보인다. */
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0;
  scrollbar-width:none;-ms-overflow-style:none}
.katex-display::-webkit-scrollbar{display:none;height:0}
.katex{scrollbar-width:none}
.katex::-webkit-scrollbar{display:none;height:0}

/* ── 문항·해설에 들어간 그림 ── */
.qimg{display:block;max-width:100%;height:auto;margin:10px 0;border-radius:10px;
      border:1px solid var(--rule);background:#fff}
.qtext svg,.exp-b svg{max-width:100%;height:auto;display:block;margin:10px 0;background:#fff;
                      border:1px solid var(--rule);border-radius:10px}
html[data-theme="dark"] .qimg,
html[data-theme="dark"] .qtext svg,
html[data-theme="dark"] .exp-b svg{filter:invert(.92) hue-rotate(180deg)}

/* ★ 해설에 가로줄이 죽 그어지던 자리.
   KaTeX 는 √ 의 꼬리·화살표·중괄호를 «내부용 <svg>» 로 그린다.
   바로 윗줄의 «문항 그림» 규칙이 그 svg 까지 잡아채서
   display:block · width:100% · 테두리 를 씌우는 바람에,
   루트 꼬리가 줄 전체로 늘어나 «가로줄» 이 됐다(다크모드에선 색까지 뒤집혔다).
   KaTeX 가 원래 쓰는 값으로 되돌려 준다. */
.qtext .katex svg,.exp-b .katex svg,
.qtext .katex-display svg,.exp-b .katex-display svg,
.easy .eb .katex svg,.mkb .katex svg,.ovl .katex svg{
  display:block;position:absolute;width:100%;height:inherit;max-width:none;
  margin:0;padding:0;border:0;border-radius:0;background:transparent;
  fill:currentColor;stroke:currentColor;filter:none;box-shadow:none}

/* ══ 형광펜 — 드래그해서 고른 글자에 연한 노란 밑칠 ══════════
   저장은 "그 블록 안에서 몇 번째 글자부터 몇 번째 글자까지"로 한다.
   수식(.katex) 안은 세지 않으므로 KaTeX 가 다시 그려도 위치가 안 밀린다. */
mark.hl{
  background:color-mix(in srgb,#FDE047 45%,transparent);
  color:inherit;border-radius:3px;padding:.05em 0;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
html[data-theme="dark"] mark.hl{background:color-mix(in srgb,#FDE047 24%,transparent)}
/* 취소선 — 틀린 보기·지워야 할 조건에 빨간 중간줄 */
/* ★ 형광펜 배경이 지워지던 자리.
   mark.hl 규칙이 이 줄보다 «위» 에 있어서, 같은 굵기의 규칙끼리는 나중 것이 이긴다.
   그래서 <mark class="hlm hl"> 의 노란 배경이 여기서 투명으로 덮여 사라졌다.
   (취소선은 이 줄보다 아래에 있어 멀쩡했다 — 취소선만 되던 이유다) */
mark.hlm{color:inherit}
mark.hlm:not(.hl){background:transparent}
/* 수식 한 덩어리·그림을 통째로 칠했을 때 — 안이 블록이라 감싸는 쪽도 블록이어야 배경이 덮인다 */
mark.hlm.blk{display:block;padding:2px 4px;margin:2px 0}
mark.hl.st{text-decoration-color:var(--stamp)}

/* 문제에 딸린 그림 — 원본 PDF에서 오려낸 조각
   --figw 는 저장된 크기(%)다. 값이 없으면 예전처럼 100%로 편다. */
.qfig{margin:12px 0 0;padding:0}
.qfig img{display:block;width:var(--figw,100%);max-width:520px;height:auto;margin:0 auto;
  border:1px solid var(--rule);border-radius:10px;background:#fff}

/* 상단 제목을 누르면 잘린 글을 펼쳐 본다. 다시 누르면 접힌다. */
$(".top .grow")?.addEventListener("click", () => {
  const t = document.querySelector(".top"); if(!t) return;
  /* 아래 문항 레일이 --head 를 기준으로 붙어 있어, 펼친 채로 두면 결국 겹친다.
     그래서 «잠깐 보고 저절로 접히는» 것으로 못 박는다. */
  const on = t.classList.toggle("wide");
  clearTimeout($(".top")._t);
  if(on) t._t = setTimeout(() => t.classList.remove("wide"), 4000);
});

/* ── 화면 좌우 넘김 단추 ──
   마우스로 끄는 넘김을 없앤 대신, 화면 양옆에 반투명 단추를 띄운다.
   평소에는 흐릿하게 있다가 스크롤하거나 가까이 가면 또렷해진다. */
.edgenav{position:fixed;top:50%;transform:translateY(-50%);z-index:55;
  width:44px;height:76px;border:0;border-radius:12px;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--ink) 26%,transparent);color:#fff;
  font:400 26px/1 var(--font-d);
  opacity:.18;transition:opacity .22s,background .22s;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body.reading .edgenav{display:flex}
.edgenav.wake{opacity:.62}
.edgenav:hover{opacity:.95;background:color-mix(in srgb,var(--ink) 62%,transparent)}
.edgenav:disabled{opacity:.06;cursor:default}
.edgenav.prev{left:6px} .edgenav.next{right:6px}
@media(max-width:720px){ .edgenav{width:34px;height:60px;font-size:21px} }
@media(hover:none){ .edgenav{opacity:.12} }
#toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:80;padding:11px 16px;border-radius:999px;background:var(--ink);color:var(--paper);
  font:600 12.5px/1 var(--font-d);opacity:0;pointer-events:none;transition:opacity .18s;max-width:90vw;text-align:center}
#toast.on{opacity:.96}
/* 문항 고르기 창 */
.jumpov{position:fixed;inset:0;z-index:88;background:rgba(10,20,35,.5);display:grid;place-items:center;padding:12px}
.jumpbox{background:var(--card);border-radius:16px;width:100%;max-width:640px;max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
.jtop{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.jtop b{font:700 14px/1 var(--font-d)}
.jtop .jstat{flex:1;font-size:11.5px;color:var(--ink-2)}
.jfind{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.jfind input{flex:1;min-width:120px;padding:9px 11px;border:1.4px solid var(--rule);border-radius:8px;
  background:var(--paper);color:var(--ink);font:500 13px/1 var(--font-m)}
.jlegend{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2)}
.jlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:2px;vertical-align:-1px}
.jlegend i.star{background:var(--stamp)}
.jlegend i.ink{background:var(--accent)}
.jlegend i.seen{background:var(--rule)}
.exl{display:block;font:600 10.5px/1 var(--font-d);letter-spacing:.08em;color:var(--ink-2);margin:0 0 6px}
.exi{width:100%;padding:10px 12px;border:1.4px solid var(--rule);border-radius:9px;
  background:var(--paper);color:var(--ink);font:500 14px/1.2 Pretendard,sans-serif}
.exi:focus{outline:0;border-color:var(--accent)}
.exh{font-size:11.5px;color:var(--ink-2);line-height:1.6;margin-top:6px}
.exh b{color:var(--ink);font-weight:600}
.delx.edit{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.jrow2{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);cursor:pointer}
.jrow2 input{accent-color:var(--accent)}
.jbody{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 16px}
.jsec{margin-top:12px}
.jhead{font:600 10.5px/1 var(--font-d);letter-spacing:.08em;color:var(--ink-2);margin-bottom:7px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.jb{padding:9px 2px;border-radius:8px;border:1.3px solid var(--rule);background:var(--card);
  color:var(--ink);font:600 12.5px/1 var(--font-m);cursor:pointer;position:relative}
.jb:active{transform:scale(.94)}
.jb.seen{background:var(--paper);color:var(--ink-2)}
.jb.star{border-color:var(--stamp);color:var(--stamp)}
.jb.ink::after{content:"";position:absolute;right:4px;bottom:4px;width:5px;height:5px;
  border-radius:50%;background:var(--accent)}
.jb.now{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qno{border:0;cursor:pointer}
.flatov{position:fixed;inset:0;z-index:90;background:rgba(10,20,35,.55);display:grid;place-items:center;padding:14px}
.flatbox{background:var(--card);border-radius:16px;max-width:760px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
.flathead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 16px;border-bottom:1px solid var(--rule);font:700 14px/1 var(--font-d)}
.flatimg{flex:1;min-height:0;overflow:auto;background:#8a9099;display:grid;place-items:center;padding:10px}
.flatimg img{max-width:100%;height:auto;display:block;background:#fff}
.flatctl{padding:12px 16px;border-top:1px solid var(--rule)}
.flatctl .fr{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.flatctl .fr>span{font:600 11px/1 var(--font-d);letter-spacing:.06em;color:var(--ink-2);min-width:56px}
.flatctl .fr>b{font:500 12px/1 var(--font-m);min-width:34px;text-align:right}
.flatctl input[type=range]{flex:1;min-width:110px;accent-color:var(--accent)}
.flatctl .chk{font-size:12.5px;color:var(--ink-2)}
.flatctl .end{justify-content:flex-end;margin-bottom:4px}
.fhint{font-size:11.5px;color:var(--ink-2);line-height:1.6}
.nx{margin-left:6px;flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;
  color:var(--ink-2);font:600 15px/1 var(--font-d);cursor:pointer}
.nx:hover,.nx:active{background:color-mix(in srgb,var(--stamp) 12%,transparent);color:var(--stamp)}
.nk.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.clean{padding:2px 0 12px;font-size:14px;line-height:1.7}
/* 표가 화면보다 넓으면 줄여 넣지 말고 가로로 밀어 본다.
   width:100% 로 우겨넣으면 "품/명" 처럼 한 글자씩 접혀서 못 읽는다. */
.clean{overflow-x:auto;-webkit-overflow-scrolling:touch}
.clean table{border-collapse:collapse;margin:8px 0;font-size:13px;
  width:max-content;min-width:100%;max-width:none}
.clean th,.clean td{border:1px solid var(--rule);padding:7px 10px;text-align:left;
  word-break:keep-all;             /* 한글 낱말을 글자 단위로 쪼개지 않는다 */
  overflow-wrap:break-word;
  min-width:56px;max-width:340px;vertical-align:top}
.clean th{background:var(--paper);font-weight:600;white-space:nowrap}
.clean td:first-child,.clean th:first-child{white-space:nowrap}   /* 품명 칸은 접지 않는다 */
.clean h2{font:700 15px/1.4 var(--font-d);margin:12px 0 6px}
.clean p:has(> :only-child), .clean p{margin:6px 0}
.clean .warnline{padding:8px 11px;border-left:3px solid var(--warn);
  background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:0 8px 8px 0;font-size:12.5px;margin:8px 0}
.rawwrap>summary{cursor:pointer;font:600 12px/1 var(--font-d);color:var(--ink-2);padding:8px 0}

/* ── 두 손가락으로 넓히고 끌어 보기 ──────────────────────────
   위험물 총정리처럼 칸이 열 개 넘는 표는 화면 폭에 절대 안 들어간다.
   좌우로만 미는 것으로는 세로까지 긴 표를 못 훑으므로, 종이를 책상에 놓고 보듯
   확대해서 아무 방향으로나 끌 수 있게 한다. 사진이든 옮긴 글이든 똑같이 먹는다. */
.nz{position:relative;overflow:hidden;border-radius:10px;background:var(--paper);
  touch-action:none;overscroll-behavior:contain}
.nz-stage{transform-origin:0 0;will-change:transform}
.nz.zoomed{cursor:grab}
.nz.zoomed:active{cursor:grabbing}
.nz-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.nz-tools .zb{font:600 12px/1 var(--font-m);min-width:32px;padding:8px 9px;border-radius:8px;
  border:1.3px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer}
.nz-tools .zb:active{transform:scale(.94)}
.nz-tools .lv{font:500 11px/1 var(--font-m);color:var(--ink-2);min-width:42px;text-align:center}
.nz-tools .sep{flex:1}
.nz-hint{font:500 11px/1.6 var(--font-d);color:var(--ink-2);margin:6px 0 0}
.nz .clean{padding:10px 12px}
.nz img{display:block;width:100%;height:auto;background:#fff}
.rawwrap[open]>summary{margin-bottom:6px}
/* 문항마다 붙는 고치기 줄은 평소엔 숨긴다.
   늘 떠 있으면 문제와 보기 사이를 갈라놓아 읽는 데 방해가 된다.
   우상단 사람 아이콘 → 정리 모드를 켰을 때만 나온다. */
.figbar{display:none;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
body.manage .figbar{display:flex}
.figbtn{font:600 11.5px/1 var(--font-d);padding:8px 11px;border-radius:8px;
  border:1.3px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer}
.figbtn:active{transform:scale(.96)}
.figbtn.del{color:var(--stamp);border-color:color-mix(in srgb,var(--stamp) 35%,transparent)}
.fighint{font-size:11px;color:var(--ink-2)}
/* 문항마다 붙는 줄이라 크면 본문을 밀어낸다 — 붙여넣기 칸도 단추 크기로 줄인다 */
.pastebox.mini{flex:none;width:auto;min-height:0;padding:8px 11px;border-radius:8px;
  border:1.3px dashed var(--rule);background:transparent;color:var(--ink-2);
  font:500 11px/1 var(--font-d);display:inline-grid;place-items:center;cursor:pointer}
.pastebox.mini b{font-family:var(--font-m);font-weight:700;color:var(--ink)}
.pastebox.mini:focus{outline:0;border-color:var(--accent);color:var(--accent)}
.fighint b{color:var(--ink);font-weight:600}

/* ── Ctrl+V 를 받는 칸 ──────────────────────────────────
   붙여넣기는 "지금 초점이 어디 있는가"로 갈린다. 그래서 눌러서 초점을 줄 수 있는
   칸을 따로 두고, 그 칸이 초점을 쥐고 있는 동안에는 그 문항으로 그림이 간다.
   화면을 넘기지 않고도 원하는 문항을 정확히 겨눌 수 있다. */
.pastebox{flex:1;min-width:160px;font:500 11px/1.45 var(--font-d);color:var(--ink-2);
  border:1.3px dashed var(--rule);border-radius:8px;padding:7px 10px;text-align:center;
  background:transparent;cursor:text;transition:border-color .15s,color .15s,background .15s}
.pastebox b{color:var(--ink);font-weight:700}
.pastebox:focus{outline:0;border-style:solid;border-color:var(--accent);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
.pastebox:focus b{color:var(--accent)}
.pastebox.over{border-style:solid;border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* ── 그림 크기 ── */
.figsize{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.figsize .figlbl{font:600 11px/1 var(--font-d);color:var(--ink-2)}
.figsize input[type=range]{width:104px;accent-color:var(--accent);cursor:pointer;padding:0;margin:0;
  touch-action:none}   /* 가로 드래그를 슬라이더가 온전히 받도록 */
.figpct{font:500 11px/1 var(--font-m);color:var(--ink-2);min-width:34px;text-align:right}
.figbtn:disabled{opacity:.4;cursor:default}
.figbtn.save:not(:disabled){border-color:var(--accent);color:var(--accent)}

/* ── 문제 본문 고쳐 쓰기 ── */
.qtextedit textarea{width:100%;min-height:120px;resize:vertical;display:block;
  font:400 13px/1.7 var(--font-m);color:var(--ink);background:var(--paper);
  border:1.4px solid var(--accent);border-radius:10px;padding:11px 12px;outline:0;white-space:pre-wrap}
.qtebar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}

/* ── 문제 제목 고쳐 쓰기 ── */
.qedit{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;
  color:var(--ink-2);background:transparent;border:0;cursor:pointer}
.qedit svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.qedit:active{transform:scale(.92)}
.qsumin{flex:1;min-width:0;font:500 12px/1.3 var(--font-d);color:var(--ink);
  background:var(--card);border:1.3px solid var(--accent);border-radius:7px;padding:6px 8px;outline:0}
.qfig figcaption{font-size:11.5px;color:var(--ink-2);text-align:center;margin-top:5px}
html[data-theme="dark"] .qfig img{background:#F7F8FA}
mark.st{
  text-decoration:line-through;
  text-decoration-color:var(--stamp);
  text-decoration-thickness:2px;
  text-underline-offset:0;
}
[data-hl]{-webkit-user-select:text;user-select:text}

.hlbar{
  position:fixed;left:0;top:0;z-index:9999;display:none;gap:2px;padding:4px;
  background:var(--card);border:1px solid var(--rule);border-radius:999px;
  box-shadow:0 8px 26px -10px rgba(16,35,61,.5);
  /* 손가락으로 누를 때 이 안에서 글자가 다시 선택되거나 iOS 확대 메뉴가 뜨면
     탭이 통째로 먹혀 버린다. 그래서 이 상자 안에서는 선택·콜아웃을 끈다. */
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;
}
.hlbar.on{display:flex}
.hlbar button{
  display:flex;align-items:center;gap:7px;padding:12px 16px;border-radius:999px;
  font:600 13px/1 var(--font-d);color:var(--ink);white-space:nowrap;
  min-height:44px;touch-action:manipulation;   /* 손가락 표준 타깃 크기 */
}
.hlbar button:active{background:var(--accent-soft)}
.hlbar button[hidden]{display:none}
.hlbar .sw{width:13px;height:13px;border-radius:4px;flex:none;
           background:#FDE047;border:1px solid color-mix(in srgb,#B59A00 60%,transparent)}
.hlbar .sw.line{background:transparent;border:0;position:relative}
.hlbar .sw.line::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;
           background:var(--stamp);transform:translateY(-1px)}
.hlbar .del{color:var(--ink-2)}

/* ── 하단 진행 ───────────────────────────────── */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:35;height:34px;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(transparent,var(--paper) 45%);
  font:500 11px/1 var(--font-m);color:var(--ink-2);pointer-events:none;
}

/* ── 상태 ────────────────────────────────────── */
.empty{text-align:center;padding:64px 20px;color:var(--ink-2)}
.empty .big{font:700 17px/1.4 var(--font-d);color:var(--ink);margin-bottom:8px}
.empty code{font-family:var(--font-m);font-size:12px;background:var(--accent-soft);
            padding:2px 6px;border-radius:5px;color:var(--ink)}
.skel{height:104px;border-radius:var(--r);background:var(--card);
      border:1px solid var(--rule);opacity:.6;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.toggle{
  display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;
  border:1.4px solid var(--rule);font:600 12px/1 var(--font-d);color:var(--ink-2);
}
.toggle.on{background:var(--veil);border-color:var(--veil);color:#fff}
.toggle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9}

/* ── 배경 음악 단추 · 작은 차림표 ── */
.bgm{position:relative;flex:none}
#bgmBtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bgmpop{position:absolute;right:0;top:calc(100% + 8px);z-index:80;display:none;
  flex-direction:column;gap:3px;min-width:206px;padding:8px;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
  box-shadow:0 14px 34px -14px rgba(16,35,61,.45)}
.bgm.open .bgmpop{display:flex}
.bgmpop .bgmh{font:600 10px/1 var(--font-d);letter-spacing:.14em;color:var(--ink-2);padding:4px 8px 6px}
.bgmpop button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  padding:9px 10px;border:0;border-radius:9px;background:transparent;cursor:pointer;
  font:600 13px/1.2 var(--font-d);color:var(--ink);text-align:left;width:100%}
.bgmpop button small{font:500 10.5px/1.2 var(--font-m);color:var(--ink-2)}
.bgmpop button:hover{background:var(--accent-soft)}
.bgmpop button.on{background:var(--accent);color:#fff}
.bgmpop button.on small{color:rgba(255,255,255,.78)}
.bgmpop button.off{border-top:1px solid var(--rule);border-radius:0 0 9px 9px;
  margin-top:4px;padding-top:11px;color:var(--ink-2)}
.bgmpop button.off.on{background:transparent;color:var(--ink-2)}
@media(max-width:560px){ #bgmTxt{display:none} #bgmBtn{padding:7px 9px} }
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.nav3{display:flex;gap:2px;padding:7px 8px;overflow-x:auto;padding-top:calc(7px + env(safe-area-inset-top));
  background:var(--ink);}
.nav3 a{flex:1;text-align:center;padding:7px 5px;border-radius:8px;
  font:600 11px/1 var(--font-d,"IBM Plex Sans KR",sans-serif);letter-spacing:.02em;
  color:color-mix(in srgb, var(--paper) 55%, transparent);text-decoration:none;
  transition:background .15s,color .15s;white-space:nowrap}
.nav3 a.on{background:color-mix(in srgb, var(--paper) 15%, transparent);color:var(--paper)}

/* 탭 사이 구분선 — 가운데만 얇게. 지금 보고 있는 탭(알약) 양옆은 지워
   알약 테두리와 선이 겹쳐 지저분해지지 않게 한다. */
.nav3 a{position:relative}
.nav3 a + a::before{content:"";position:absolute;left:-1px;top:24%;bottom:24%;width:1px;
  background:color-mix(in srgb,var(--paper) 20%,transparent)}
.nav3 a.on::before,.nav3 a.on + a::before{background:transparent}
.nav3 a:not(.on):hover{color:var(--paper)}
</style>
</head>

     실기 뷰어와 같은 틀. 위아래로 오래 스크롤하지 않고 한 화면에서 대조한다. -->
<div class="gvl" id="gvl">
  <div class="gh">
    <div class="gt"><span id="gvTitle">—</span><small id="gvSub"></small></div>
    <button class="gb" type="button" id="gvPrev">‹ 이전</button>
    <button class="gb" type="button" id="gvNext">다음 ›</button>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
