<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* ★ 낡은 서비스 워커가 이 페이지를 물고 있으면 스스로 지우고 한 번만 새로고침한다.
   "강력 새로고침 해주세요" "Unregister 눌러주세요" 안내를 계속 반복할 필요가 없도록. */
(function(){
  if('serviceWorker' in navigator && navigator.serviceWorker.controller && !sessionStorage.getItem('sw-cleared-v3')){
    sessionStorage.setItem('sw-cleared-v3','1');
    navigator.serviceWorker.getRegistrations().then(function(regs){
      return Promise.all(regs.map(function(r){ return r.unregister(); }));
    }).then(function(){ location.reload(); });
  }
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#E9ECE6">
<title>기출 해설 노트</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
/* ══════════════════════════════════════════════════════
   답안지(OMR) × 청사진 — 디자인 토큰
   ══════════════════════════════════════════════════════ */
:root{
  --paper:#E9ECE6;      /* 답안지 종이 */
  --card:#FCFCFA;       /* 문제 카드 */
  --ink:#10233D;        /* 본문 잉크 */
  --ink-2:#5A6B7F;      /* 보조 */
  --rule:#D3D8CD;       /* 괘선 */
  --stamp:#BE2B26;      /* 정답 도장 — 오직 정답에만 */
  --accent:#1D4ED8;     /* 조작 가능한 것 */
  --accent-soft:#E4ECFD;
  --veil:#C4433C;       /* 가림판 */
  --shadow:0 1px 0 rgba(16,35,61,.05), 0 6px 20px -14px rgba(16,35,61,.5);
  --r:14px;
  --head:56px;
  --rail:46px;
  --qhead:52px;   /* 문항 헤더(번호·제목·필기·별표) 고정 바 높이 */
  --font-d:"IBM Plex Sans KR",Pretendard,sans-serif;
  --font-b:Pretendard,"IBM Plex Sans KR",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,monospace;
}
html[data-theme="dark"]{
  --paper:#0E1520; --card:#161E29; --ink:#E3E9F1; --ink-2:#8A9AAE;
  --rule:#26303D; --stamp:#FF7A6E; --accent:#7BA2FF; --accent-soft:#1B2740;
  --veil:#8E322C;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -16px #000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-b);font-size:15px;line-height:1.62;
  letter-spacing:-.01em;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--accent);text-decoration:none}
.mono{font-family:var(--font-m);font-feature-settings:"tnum"}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── 상단 바 ─────────────────────────────────── */
.top{
  position:sticky;top:0;z-index:40;height:var(--head);
  padding:0 14px;padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);
}
.top h1{font:600 15px/1.2 var(--font-d);margin:0;letter-spacing:-.02em}
.top .sub{font-size:11px;color:var(--ink-2);margin-top:1px}
.top .grow{flex:1;min-width:0}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2)}
.icon:active{background:var(--accent-soft)}
.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── 화면 전환 ───────────────────────────────── */
.view{display:none;animation:in .22s ease both}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{padding:18px 14px 90px;max-width:760px;margin:0 auto}

/* ── 섹션 라벨: 실제 개수를 담는 괘선 ─────────── */
.eyebrow{
  display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;
  font:600 11px/1 var(--font-d);letter-spacing:.14em;color:var(--ink-2);
}
.eyebrow:first-child{margin-top:4px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
.eyebrow .n{font-family:var(--font-m);letter-spacing:0}

/* ── 과목 카드 ───────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
.subj{
  position:relative;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:14px 14px 12px;text-align:left;
  box-shadow:var(--shadow);transition:transform .12s,border-color .12s;
  display:flex;flex-direction:column;min-height:104px;
}
.subj:active{transform:scale(.98)}
.subj .tag{font:600 10px/1 var(--font-d);letter-spacing:.08em;color:var(--ink-2)}
.subj .nm{font:700 16px/1.3 var(--font-d);margin-top:8px;letter-spacing:-.03em;flex:1}
.subj .meta{font-family:var(--font-m);font-size:11px;color:var(--ink-2);margin-top:10px;display:flex;gap:8px}
.subj .bar{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}

/* ── 회차 행 ─────────────────────────────────── */
#reroll{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;
  padding:12px 16px;border-radius:999px;border:0;cursor:pointer;
  font:700 13px/1 var(--font-d);color:#fff;background:var(--accent);
  box-shadow:0 4px 14px -4px rgba(16,35,61,.5)}
#reroll:active{transform:scale(.95)}
#reroll[hidden]{display:none}
.mixbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:7px;margin:4px 0 8px}
.mixb{padding:12px 8px;border-radius:11px;border:1.5px solid var(--rule);background:var(--card);
  font:700 12.5px/1.2 var(--font-d);color:var(--ink);cursor:pointer}
.mixb:active{transform:scale(.97)}
.mixb.rnd{border-color:var(--accent);color:var(--accent)}
.mixb.g{border-color:#C79A16;color:#946F06;background:#FDF6E3}
.mixb.s{border-color:#9AA6B2;color:#5E6C7A;background:#F2F4F6}
.mixb.b{border-color:#B98A63;color:#8A5F3C;background:#FAF1E9}
.mixb.r{border-color:var(--rule);color:var(--ink-2)}
.mixb .c{display:block;font:500 10.5px/1 var(--font-m);opacity:.75;margin-top:5px}
.mixnote{font-size:11.5px;color:var(--ink-2);line-height:1.7;margin:0 0 16px}
.mixnote b{color:var(--ink);font-weight:600}

/* ── 시험 정보 · 출제경향 ── */
.infob{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--rule);
  background:var(--card);color:var(--ink);font:600 12.5px/1 var(--font-d);cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.infob .arw{color:var(--ink-2);font:500 11px/1 var(--font-m);transition:transform .15s}
.infob.on{border-color:var(--accent);color:var(--accent)}
.infob.on .arw{transform:rotate(180deg);color:var(--accent)}
.infopanel{display:none;margin:0 0 14px;padding:14px;border-radius:12px;
  background:var(--card);border:1px solid var(--rule)}
.infopanel.on{display:block}
.infopanel h4{font:600 12px/1 var(--font-d);letter-spacing:.06em;color:var(--ink-2);
  margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.infopanel section + section{margin-top:18px}
.infopanel p{margin:0 0 8px;font-size:12px;line-height:1.75;color:var(--ink-2)}
.infopanel p b{color:var(--ink);font-weight:600}
.era{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:12px}
.era:first-of-type{border-top:0}
.era .lab{flex:none;width:104px;font:600 11.5px/1.5 var(--font-m);color:var(--ink)}
.era .txt{flex:1;color:var(--ink-2);line-height:1.6}
.era.now .lab{color:var(--accent)}
.flag{display:inline-block;font:600 10px/1 var(--font-d);padding:3px 6px;border-radius:5px;
  background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);margin-left:5px}
.gapline{font:400 11.5px/1.7 var(--font-m);color:var(--ink-2)}
.gapline b{color:var(--ink);font-weight:600}
.gapline .miss{color:var(--stamp)}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topic{font:500 11.5px/1 var(--font-d);padding:7px 9px;border-radius:8px;
  background:var(--paper);border:1px solid var(--rule);color:var(--ink)}
.topic i{font-style:normal;color:var(--ink-2);font-family:var(--font-m);font-size:10.5px;margin-left:5px}
.barrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px}
.barrow .nm{flex:none;width:118px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .tr{flex:1;height:7px;border-radius:4px;background:var(--paper);overflow:hidden}
.barrow .fl{height:100%;background:var(--accent);border-radius:4px}
.barrow .vv{flex:none;font:500 10.5px/1 var(--font-m);color:var(--ink-2);width:44px;text-align:right}
.year{font:600 13px/1 var(--font-m);color:var(--ink-2);margin:20px 0 8px;letter-spacing:.04em}
.rows{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
  text-align:left;box-shadow:var(--shadow);transition:transform .12s;
}
.row:active{transform:scale(.99)}
.row .no{font:600 15px/1 var(--font-m);width:34px;flex:none}
.row .ttl{flex:1;font-size:14px;font-weight:500}
.row .cnt{font-family:var(--font-m);font-size:11px;color:var(--ink-2)}
.row .chev{color:var(--ink-2);opacity:.6}
.row .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}

/* ══ 문항 번호 레일 — 답안지 마킹칸 ══════════════ */
.rail{
  position:sticky;top:calc(var(--head) + env(safe-area-inset-top));z-index:30;
  height:var(--rail);display:flex;align-items:center;gap:5px;
  padding:0 12px;overflow-x:auto;scrollbar-width:none;
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);
}
.rail::-webkit-scrollbar{display:none}
.bub{
  flex:none;position:relative;min-width:28px;height:28px;padding:0 6px;
  border-radius:999px;border:1.4px solid var(--rule);
  font:500 12px/1 var(--font-m);color:var(--ink-2);
  display:grid;place-items:center;transition:all .16s;
}
.bub.seen{border-color:color-mix(in srgb,var(--ink) 30%,transparent);color:var(--ink)}
.bub.star::after{
  content:"";position:absolute;top:-1px;right:-1px;width:6px;height:6px;
  border-radius:50%;background:var(--stamp);
}
.bub.now{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}

/* ── 스와이프 트랙 ───────────────────────────── */
.track{
  display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;
  height:calc(100dvh - var(--head) - var(--rail) - env(safe-area-inset-top));
  overscroll-behavior-x:contain;
}
.track::-webkit-scrollbar{display:none}
.slide{
  flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;
  overflow-y:auto;overscroll-behavior-y:contain;
  padding:0 14px calc(48px + env(safe-area-inset-bottom));
}
.sheet-body{max-width:760px;margin:0 auto}

/* ══ 화면 배치 3가지 ═══════════════════════════════════════
   ① swipe-x (기본) : 좌우로 밀어 다음 문항. 지금까지 쓰던 방식.
   ② swipe-y        : 위아래로 밀어 다음 문항. 한 손으로 엄지만 써서 넘길 때 편하다.
   ③ split          : 화면을 좌우로 갈라 왼쪽엔 문제, 오른쪽엔 해설.
                      해설이 길어도 문제를 계속 보면서 읽을 수 있다.
                      화면이 좁으면(<900px) 의미가 없으므로 자동으로 한 단으로 돌아간다. */

/* ② 세로 넘김 — 트랙을 세로로 세우고 스냅 축만 바꾼다 */
.track.vert{
  flex-direction:column;
  overflow-x:hidden;overflow-y:auto;
  scroll-snap-type:y mandatory;
  overscroll-behavior-y:contain;overscroll-behavior-x:auto;
}
.track.vert .slide{
  flex:0 0 100%;
  height:calc(100dvh - var(--head) - var(--rail) - env(safe-area-inset-top));
}

/* ③ 좌우 2단 — 문제 카드와 해설을 나란히 */
@media(min-width:900px){
  .split .sheet-body{max-width:1400px}
  .split .splitcols{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:16px;align-items:start;
  }
  /* 두 칸 각각이 따로 스크롤된다 — 해설을 내려도 문제는 그대로 보인다 */
  .split .splitcols > *{
    max-height:calc(100dvh - var(--head) - var(--rail) - var(--qhead) - 40px);
    overflow-y:auto;overscroll-behavior:contain;
  }
  .split .splitcols > *::-webkit-scrollbar{width:6px}
  .split .splitcols > *::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
  /* 필기 중인 문항은 좌표계가 고정폭 가상 페이지(400px)라 2단으로 쪼개면 잉크가 어긋난다.
     그래서 필기가 올라간 문항은 2단을 적용하지 않고 한 단 그대로 둔다. */
  .split .inkpage .splitcols{display:block}
  .split .inkpage .splitcols > *{max-height:none;overflow:visible}
}

/* ── 문항 헤더 ───────────────────────────────── */
/* 슬라이드를 아래로 스크롤해도 번호·제목·필기·별표 바는 위에 계속 붙어 있는다.
   .slide 가 세로 스크롤 컨테이너이므로, 그 안에서 sticky top:0 이면 스크롤포트 맨 위에 고정된다.
   ★ 위 여백을 마이너스 마진으로 상쇄하면 안 된다 — sticky 는 "마진 박스"를 기준으로 붙기 때문에
     그만큼 바가 아래로 밀리고 그 틈으로 카드 윗부분(2과목 …)이 비쳐 보인다.
     그래서 .slide 의 위 여백 자체를 0 으로 두고, 이 바가 첫 요소로서 여백 역할까지 겸한다.
   좌우 -14px 은 .slide 의 좌우 여백만 상쇄해 바가 화면 폭을 꽉 채우게 만든다. */
.qhead{
  position:sticky;top:0;z-index:28;
  display:flex;align-items:center;gap:10px;
  height:var(--qhead);flex:none;
  margin:0 -14px 10px;padding:0 14px;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
}

/* ══ 필기 ═══════════════════════════════════════════════ */
.qink{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:9px;color:var(--ink-2)}
.qink svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qink.has{color:var(--accent)}
.qink.on{background:var(--accent);color:#fff}

/* 고정폭 가상 페이지: 여기 안에서는 절대 다시 줄바꿈되지 않는다.
   폭이 바뀌면(회전 등) 이 블록 통째로 scale() 되므로 글자와 잉크가 항상 같이 움직인다 */
.inkwrap{position:relative;overflow:hidden;border-radius:var(--r);box-shadow:var(--shadow);
         background:var(--card);border:1px solid var(--rule)}

/* ══ 두 손가락 핀치 확대 ═══════════════════════════════════
   zoomstage 를 CSS zoom 으로 키운다(transform 이 아니라 zoom).
   zoom 은 실제 레이아웃 크기를 바꾸므로, 안쪽의 필기 캔버스가
   쓰는 auto-fit 배율(factor = 부모폭/400) 도 자동으로 같이 커진다 —
   그래서 확대해도 글자와 잉크가 같은 비율로 같이 커진다. */
.zoomwrap{position:relative;overflow:hidden;touch-action:pan-y}
.zoomstage{transform-origin:0 0;will-change:transform}
.zoomreset{display:none;position:absolute;top:8px;right:8px;z-index:25;
  padding:6px 11px;border-radius:999px;background:var(--ink);color:var(--paper);
  font:600 11px/1 var(--font-m);box-shadow:var(--shadow);letter-spacing:.02em}
.zoomwrap.zoomed .zoomreset{display:block}
.inkpage{width:400px;transform-origin:top left;position:relative;padding:16px}
.inkpage .qhead{padding:0}
.inkcanvas{position:absolute;inset:0;width:400px;touch-action:none;transform-origin:top left}
.inkcanvas.edit{cursor:crosshair}
/* 이동(손) 모드: 캔버스가 터치를 안 받고 그대로 통과시키므로 평소처럼 스크롤·스와이프·핀치가 된다.
   확대돼 있을 때는 한 손가락 드래그로 화면을 끌어서 옮긴다(포토샵 손도구와 같은 감각). */
.zoomwrap.panmode{cursor:grab}
.zoomwrap.panmode:active{cursor:grabbing}

/* 도구모음도 문항 헤더 바로 밑에 고정 — 아래쪽 해설을 필기하는 중에도 도구를 바꿀 수 있다.
   모바일 세로 화면에서는 두 줄(윗줄 = 도구, 아랫줄 = 색·되돌리기·닫기)로 나눠 버튼이 안 잘리게 한다.
   가로로 눕히거나 화면이 넓으면 한 줄로 합친다. */
.inktools{position:sticky;top:var(--qhead);z-index:27;
  display:flex;flex-direction:column;gap:6px;
  margin:0 -14px 0;padding:8px 14px;
  border-bottom:1px solid var(--rule);
  background:color-mix(in srgb,var(--card) 96%,var(--paper))}
.itrow{display:flex;align-items:center;gap:5px;min-width:0;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.itrow::-webkit-scrollbar{display:none}
@media(min-width:640px){
  .inktools{flex-direction:row;align-items:center;gap:8px}
  .itrow{flex:0 1 auto}
  .itrow.tools{flex:none}
}
.itbtn{flex:none;height:30px;padding:0 9px;border-radius:8px;border:1.4px solid var(--rule);
  font:600 11.5px/1 var(--font-d);color:var(--ink-2);display:flex;align-items:center;gap:5px}
.itbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.itbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.itsep{width:1px;align-self:stretch;background:var(--rule);margin:0 2px}
.itcolor{width:22px;height:22px;border-radius:50%;border:2px solid transparent;flex:none}
.itcolor.on{border-color:var(--ink)}
.itgrow{flex:1}
.itsave{flex:none;font:500 10.5px/1 var(--font-m);color:var(--ink-2);white-space:nowrap;margin-left:6px}

/* 펜 투명도 슬라이더 — 형광펜처럼 옅게, 또는 완전히 진하게 */
.itopa{display:flex;align-items:center;gap:6px;flex:none;
  padding:0 8px;height:30px;border-radius:8px;border:1.4px solid var(--rule)}
.itopa label{font:600 10.5px/1 var(--font-d);color:var(--ink-2);white-space:nowrap;margin:0}
.itopa input[type=range]{width:74px;accent-color:var(--accent);margin:0}
.itopa .val{font:500 10.5px/1 var(--font-m);color:var(--ink-2);width:30px;text-align:right}

/* ══ F9 가림막 — 누르면 화면이 즉시 흰색으로 덮인다 ══════════
   자리를 비울 때 어깨너머로 보이지 않게 하는 용도.
   아무 키나 누르거나 화면을 누르면 원래대로 돌아온다. */
#blank{
  position:fixed;inset:0;z-index:9999;display:none;
  background:#fff;
}
#blank.on{display:block}
#blank .tip{
  position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
  font:500 11px/1 var(--font-m);color:#D8D8D8;letter-spacing:.04em;user-select:none;
}
html[data-theme="dark"] #blank{background:#fff}

/* ── 로그인 팝오버(필기용) ── */
.inkauth{position:relative}
.inkpop{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;width:250px;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:14px}
.inkpop.on{display:block}
.inkpop input{width:100%;padding:9px 10px;border:1.4px solid var(--rule);border-radius:8px;
  background:var(--paper);color:var(--ink);font:inherit;font-size:13px;margin-bottom:7px}
.inkpop button{width:100%;padding:9px;border:0;border-radius:8px;background:var(--ink);
  color:var(--paper);font:600 13px/1 var(--font-d)}
.inkpop .hint{font-size:11px;color:var(--ink-2);margin-top:8px;line-height:1.5}
.inkpop .err{font-size:11.5px;color:var(--stamp);margin-top:6px}

.qno{font:600 13px/1 var(--font-m);color:var(--paper);background:var(--ink);
     padding:6px 9px;border-radius:7px;letter-spacing:.02em}
.qsum{flex:1;font-size:12px;color:var(--ink-2);font-weight:500;min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qstar{width:32px;height:32px;display:grid;place-items:center;color:var(--ink-2)}
.qstar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.qstar.on{color:var(--stamp)}
.qstar.on svg{fill:currentColor}

/* ── 정리 모드 — 로그인 + 스위치를 켰을 때만 보이는 삭제 단추 ── */
.delx{display:none;flex:none;align-items:center;justify-content:center;
      padding:5px 9px;border-radius:8px;background:transparent;
      border:1.3px solid var(--stamp);color:var(--stamp);
      font:600 11px/1 var(--font-d);white-space:nowrap;cursor:pointer}
.delx:active{background:color-mix(in srgb,var(--stamp) 12%,transparent)}
body.manage .delx{display:inline-flex}
.delx.wipe{border-color:var(--ink-2);color:var(--ink-2)}
.subj .delx,.row .delx{margin-left:6px}
.qhead .delx{margin-left:2px}

/* ── 문제 카드 ───────────────────────────────── */
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
       padding:16px;box-shadow:var(--shadow)}
.qtext{font-size:15.5px;line-height:1.72;font-weight:500;word-break:keep-all}
.part{font:600 10px/1 var(--font-d);letter-spacing:.1em;color:var(--ink-2);margin-bottom:9px}

/* ── 보기 = OMR 마킹 ─────────────────────────── */
.choices{margin-top:16px;display:flex;flex-direction:column;gap:2px}
.ch{display:flex;gap:11px;align-items:flex-start;padding:9px 8px;border-radius:9px}
.ch .b{
  flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);
  font:500 11px/1 var(--font-m);display:grid;place-items:center;color:var(--ink-2);
  margin-top:1px;transition:all .2s;
}
.ch .t{flex:1;font-size:14.5px;line-height:1.6}
.ch.ok .b{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:600}
.ch.ok .t{font-weight:600}
.ch.ok{background:color-mix(in srgb,var(--stamp) 7%,transparent)}
.veiled .ch.ok .b{background:none;border-color:var(--rule);color:var(--ink-2);font-weight:500}
.veiled .ch.ok .t{font-weight:400}
.veiled .ch.ok{background:none}

/* ══ 가림판 — 이 앱의 서명 동작 ═══════════════════
   해설을 display:none 시키지 않고, 빨간 가림판이
   내려앉는 것처럼 덮는다. 눌러서 이 문항만 살짝 들추기. */
.answer{margin-top:14px;position:relative}
.answer .inner{transition:opacity .26s ease,transform .26s ease,filter .26s ease}
.veiled .answer{min-height:58px}
.veiled .answer .inner{
  opacity:0;transform:translateY(-8px) scale(.995);filter:blur(3px);
  pointer-events:none;height:0;overflow:hidden;
}
.cover{
  display:none;position:absolute;inset:0;height:58px;width:100%;
  border-radius:12px;border:1px dashed color-mix(in srgb,var(--veil) 55%,transparent);
  background:color-mix(in srgb,var(--veil) 9%,var(--card));
  color:var(--veil);font:600 12.5px/1 var(--font-d);letter-spacing:-.01em;
  align-items:center;justify-content:center;gap:7px;
}
.veiled .cover{display:flex}
.cover svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.slide.peek .answer .inner{opacity:1;transform:none;filter:none;pointer-events:auto;height:auto;overflow:visible}
.slide.peek .answer{min-height:0}
.slide.peek .cover{display:none}
.slide.peek .ch.ok .b{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:600}
.slide.peek .ch.ok{background:color-mix(in srgb,var(--stamp) 7%,transparent)}
.slide.peek .ch.ok .t{font-weight:600}

/* ── 해설 본문 ───────────────────────────────── */
.exp{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
     padding:16px;box-shadow:var(--shadow)}
.exp-h{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--font-d);
       letter-spacing:.12em;color:var(--ink-2);margin-bottom:12px}
.exp-h::after{content:"";flex:1;height:1px;background:var(--rule)}
.exp-b{font-size:14.5px;line-height:1.75}
.exp-b p{margin:0 0 10px}
.exp-b ul,.exp-b ol{margin:0 0 10px;padding-left:20px}
.exp-b li{margin:3px 0}
.exp-b strong{font-weight:700;color:var(--ink)}
.exp-b code{font-family:var(--font-m);font-size:.9em;background:var(--accent-soft);
            padding:1px 5px;border-radius:4px}
.exp-b hr{border:0;border-top:1px solid var(--rule);margin:14px 0}
/* 기존 도구가 만든 통짜 시트 HTML 수용 */
.sheet-host{overflow-x:auto}
.sheet-host .sheet{background:transparent!important;box-shadow:none!important;
                   border:0!important;padding:0!important;margin:0!important;
                   max-width:100%!important;width:auto!important}
.sheet-host img,.sheet-host svg{max-width:100%;height:auto}
.sheet-host table{width:100%;border-collapse:collapse;font-size:13px}
.mdtable{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.mdtable table{border-collapse:collapse;width:100%;font-size:13.5px}
.mdtable th,.mdtable td{border:1px solid var(--rule);padding:6px 9px;text-align:left;white-space:nowrap}
.mdtable th{background:var(--accent-soft);font-weight:600;color:var(--ink)}
.mdtable td:first-child{white-space:normal;font-weight:500}
html[data-theme="dark"] .sheet-host{filter:invert(.92) hue-rotate(180deg)}
html[data-theme="dark"] .sheet-host img{filter:invert(1) hue-rotate(180deg)}
.katex{font-size:1.02em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}

/* ── 문항·해설에 들어간 그림 ── */
.qimg{display:block;max-width:100%;height:auto;margin:10px 0;border-radius:10px;
      border:1px solid var(--rule);background:#fff}
.qtext svg,.exp-b svg{max-width:100%;height:auto;display:block;margin:10px 0;background:#fff;
                      border:1px solid var(--rule);border-radius:10px}
html[data-theme="dark"] .qimg,
html[data-theme="dark"] .qtext svg,
html[data-theme="dark"] .exp-b svg{filter:invert(.92) hue-rotate(180deg)}

/* ══ 형광펜 — 드래그해서 고른 글자에 연한 노란 밑칠 ══════════
   저장은 "그 블록 안에서 몇 번째 글자부터 몇 번째 글자까지"로 한다.
   수식(.katex) 안은 세지 않으므로 KaTeX 가 다시 그려도 위치가 안 밀린다. */
mark.hl{
  background:color-mix(in srgb,#FDE047 45%,transparent);
  color:inherit;border-radius:3px;padding:.05em 0;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
html[data-theme="dark"] mark.hl{background:color-mix(in srgb,#FDE047 24%,transparent)}
/* 취소선 — 틀린 보기·지워야 할 조건에 빨간 중간줄 */
mark.hlm{background:transparent;color:inherit}

/* 문제에 딸린 그림 — 원본 PDF에서 오려낸 조각
   --figw 는 저장된 크기(%)다. 값이 없으면 예전처럼 100%로 편다. */
.qfig{margin:12px 0 0;padding:0}
.qfig img{display:block;width:var(--figw,100%);max-width:520px;height:auto;margin:0 auto;
  border:1px solid var(--rule);border-radius:10px;background:#fff}
#toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:80;padding:11px 16px;border-radius:999px;background:var(--ink);color:var(--paper);
  font:600 12.5px/1 var(--font-d);opacity:0;pointer-events:none;transition:opacity .18s;max-width:90vw;text-align:center}
#toast.on{opacity:.96}
.figbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
.figbtn{font:600 11.5px/1 var(--font-d);padding:8px 11px;border-radius:8px;
  border:1.3px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer}
.figbtn:active{transform:scale(.96)}
.figbtn.del{color:var(--stamp);border-color:color-mix(in srgb,var(--stamp) 35%,transparent)}
.fighint{font-size:11px;color:var(--ink-2)}
.fighint b{color:var(--ink);font-weight:600}

/* ── Ctrl+V 를 받는 칸 ──────────────────────────────────
   붙여넣기는 "지금 초점이 어디 있는가"로 갈린다. 그래서 눌러서 초점을 줄 수 있는
   칸을 따로 두고, 그 칸이 초점을 쥐고 있는 동안에는 그 문항으로 그림이 간다.
   화면을 넘기지 않고도 원하는 문항을 정확히 겨눌 수 있다. */
.pastebox{flex:1;min-width:160px;font:500 11px/1.45 var(--font-d);color:var(--ink-2);
  border:1.3px dashed var(--rule);border-radius:8px;padding:7px 10px;text-align:center;
  background:transparent;cursor:text;transition:border-color .15s,color .15s,background .15s}
.pastebox b{color:var(--ink);font-weight:700}
.pastebox:focus{outline:0;border-style:solid;border-color:var(--accent);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
.pastebox:focus b{color:var(--accent)}
.pastebox.over{border-style:solid;border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* ── 그림 크기 ── */
.figsize{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.figsize .figlbl{font:600 11px/1 var(--font-d);color:var(--ink-2)}
.figsize input[type=range]{width:104px;accent-color:var(--accent);cursor:pointer;padding:0;margin:0;
  touch-action:none}   /* 가로 드래그를 슬라이더가 온전히 받도록 */
.figpct{font:500 11px/1 var(--font-m);color:var(--ink-2);min-width:34px;text-align:right}
.figbtn:disabled{opacity:.4;cursor:default}
.figbtn.save:not(:disabled){border-color:var(--accent);color:var(--accent)}

/* ── 문제 본문 고쳐 쓰기 ── */
.qtextedit textarea{width:100%;min-height:120px;resize:vertical;display:block;
  font:400 13px/1.7 var(--font-m);color:var(--ink);background:var(--paper);
  border:1.4px solid var(--accent);border-radius:10px;padding:11px 12px;outline:0;white-space:pre-wrap}
.qtebar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}

/* ── 문제 제목 고쳐 쓰기 ── */
.qedit{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;
  color:var(--ink-2);background:transparent;border:0;cursor:pointer}
.qedit svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.qedit:active{transform:scale(.92)}
.qsumin{flex:1;min-width:0;font:500 12px/1.3 var(--font-d);color:var(--ink);
  background:var(--card);border:1.3px solid var(--accent);border-radius:7px;padding:6px 8px;outline:0}
.qfig figcaption{font-size:11.5px;color:var(--ink-2);text-align:center;margin-top:5px}
html[data-theme="dark"] .qfig img{background:#F7F8FA}
mark.st{
  text-decoration:line-through;
  text-decoration-color:var(--stamp);
  text-decoration-thickness:2px;
  text-underline-offset:0;
}
[data-hl]{-webkit-user-select:text;user-select:text}

.hlbar{
  position:fixed;left:0;top:0;z-index:60;display:none;gap:2px;padding:4px;
  background:var(--card);border:1px solid var(--rule);border-radius:999px;
  box-shadow:0 8px 26px -10px rgba(16,35,61,.5);
}
.hlbar.on{display:flex}
.hlbar button{
  display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
  font:600 12.5px/1 var(--font-d);color:var(--ink);white-space:nowrap;
}
.hlbar button:active{background:var(--accent-soft)}
.hlbar button[hidden]{display:none}
.hlbar .sw{width:13px;height:13px;border-radius:4px;flex:none;
           background:#FDE047;border:1px solid color-mix(in srgb,#B59A00 60%,transparent)}
.hlbar .sw.line{background:transparent;border:0;position:relative}
.hlbar .sw.line::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;
           background:var(--stamp);transform:translateY(-1px)}
.hlbar .del{color:var(--ink-2)}

/* ── 하단 진행 ───────────────────────────────── */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:35;height:34px;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(transparent,var(--paper) 45%);
  font:500 11px/1 var(--font-m);color:var(--ink-2);pointer-events:none;
}

/* ── 상태 ────────────────────────────────────── */
.empty{text-align:center;padding:64px 20px;color:var(--ink-2)}
.empty .big{font:700 17px/1.4 var(--font-d);color:var(--ink);margin-bottom:8px}
.empty code{font-family:var(--font-m);font-size:12px;background:var(--accent-soft);
            padding:2px 6px;border-radius:5px;color:var(--ink)}
.skel{height:104px;border-radius:var(--r);background:var(--card);
      border:1px solid var(--rule);opacity:.6;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.toggle{
  display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;
  border:1.4px solid var(--rule);font:600 12px/1 var(--font-d);color:var(--ink-2);
}
.toggle.on{background:var(--veil);border-color:var(--veil);color:#fff}
.toggle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.nav3{display:flex;gap:2px;padding:7px 8px;overflow-x:auto;padding-top:calc(7px + env(safe-area-inset-top));
  background:var(--ink);}
.nav3 a{flex:1;text-align:center;padding:7px 5px;border-radius:8px;
  font:600 11px/1 var(--font-d,"IBM Plex Sans KR",sans-serif);letter-spacing:.02em;
  color:color-mix(in srgb, var(--paper) 55%, transparent);text-decoration:none;
  transition:background .15s,color .15s;white-space:nowrap}
.nav3 a.on{background:color-mix(in srgb, var(--paper) 15%, transparent);color:var(--paper)}
.nav3 a:not(.on):hover{color:var(--paper)}
</style>
</head>

<!-- ══ 상단 ══ -->
<header class="top">
  <button class="icon" id="back" hidden aria-label="뒤로">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="grow">
    <h1 id="ttl">기출 해설 노트</h1>
    <div class="sub" id="sub"></div>
  </div>
  <button class="toggle" id="veilBtn" hidden>
    <svg viewBox="0 0 24 24" id="veilIcon"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
    <span id="veilTxt">해설 보임</span>
  </button>
  <button class="icon" id="layoutBtn" hidden aria-label="화면 배치 전환" title="화면 배치 — 세로 넘김 / 가로 넘김 / 좌우 2단">
    <svg viewBox="0 0 24 24" id="layoutIcon"></svg>
  </button>
  <button class="icon" id="theme" aria-label="화면 밝기 전환">
    <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
  </button>
  <div class="inkauth">
    <button class="icon" id="inkAuthBtn" aria-label="필기 로그인">
      <svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9z"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
    <div class="inkpop" id="inkPop">
      <div id="inkPopIn">
        <input id="inkEm" type="email" placeholder="이메일" autocomplete="username">
        <input id="inkPw" type="password" placeholder="비밀번호" autocomplete="current-password">
        <button id="inkLoginBtn">로그인</button>
        <div class="hint">로그인하면 문항에 펜·형광펜·밑줄로 필기할 수 있습니다.</div>
        <div class="err" id="inkErr"></div>
      </div>
      <div id="inkPopOut" hidden>
        <div class="hint" style="margin-top:0">필기와 정리(삭제)가 가능한 상태입니다.</div>
        <button id="manageBtn" style="margin-top:8px">정리 모드 켜기</button>
        <div class="hint">켜면 과목·회차·문항 옆에 삭제 단추가 나타납니다. 지운 것은 되돌릴 수 없습니다.</div>
        <button id="inkLogoutBtn" style="margin-top:8px;background:transparent;border:1.4px solid var(--rule);color:var(--ink)">로그아웃</button>
      </div>
    </div>
  </div>
</header>

<!-- ══ 1. 과목 ══ -->
<section class="view on" id="v-subjects">

<script>
/* ═══════════════════════════════════════════════
   상태
   ═══════════════════════════════════════════════ */
const CFG = window.APP_CONFIG || {};
const sb = (window.supabase && CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("xxxx"))
  ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY)

const LS = {
  get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let S = {
  subjects:[], exams:[], questions:[], exam:null, subject:null,
  idx:0, veil:LS.get("veil",false), stars:LS.get("stars",{}), seen:LS.get("seen",{}),
  layout:LS.get("layout","swipe-x"),
  loggedIn:false, anno:{}   // anno[question_id] = {strokes, page_width}
};

const $  = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 본문 맨 앞에 다시 붙어 있는 문항 번호("1. ", "23) ", "(4) ", "문제 5. ")를 지운다.
   화면 왼쪽에 이미 번호 배지가 따로 있으므로 중복이고, 예전에 올린 회차에도 남아 있어서
   저장된 값을 고치지 않고 화면에 그릴 때 걸러낸다.
   숫자 뒤에 반드시 공백이 와야만 지우므로 "1.5kg", "2단압축", "20℃" 같은 진짜 본문은 건드리지 않는다. */
function stripQNo(s){
  return String(s??"").replace(
    /^[\s\u00A0]*(?:문제|문항)?[\s\u00A0]*(?:[[(][\s\u00A0]*\d{1,3}[\s\u00A0]*[\])]|\d{1,3}[\s\u00A0]*[.)])[\s\u00A0]+/,
    ""
  );
}

/* ═══════════════════════════════════════════════

/* session 을 넘겨받으면 getSession() 을 부르지 않는다.
   onAuthStateChange 콜백 안에서 getSession() 을 부르면 잠금이 서로를 기다려 굳어버리기 때문이다. */
async function inkRefresh(session){
  if(!sb) return;
  const was = S.loggedIn;
  if(session === undefined){
    const {data} = await sb.auth.getSession();
    session = data.session;
  }
  S.loggedIn = !!session;
  $("#inkPopIn").hidden = S.loggedIn;
  $("#inkPopOut").hidden = !S.loggedIn;
  $("#inkAuthBtn").classList.toggle("on", S.loggedIn);
  $$(".qink").forEach(b => b.classList.toggle("loggedin", S.loggedIn));
  if(!S.loggedIn) setManage(false);
  /* 고치기 단추들은 로그인 여부를 보고 그릴지 말지를 정한다. 그래서 로그인 상태가
     바뀌면 이미 그려둔 문항을 다시 그려야 단추가 나타나거나 사라진다.
     필기 중인 문항은 건드리지 않는다 — 다시 그리면 그리던 획이 날아간다. */
  if(was !== S.loggedIn) redrawOpenCards();
}

function redrawOpenCards(){
  $$("#track .slide .sheet-body").forEach(body => {
    if(body.dataset.h !== "1" || body.__ink?.editing) return;
    body.dataset.h = "0"; body.__ink = null; body.__zoom = null;
    hydrate(+body.parentElement.dataset.i);
  });
}
$("#inkAuthBtn")?.addEventListener("click", ()=> $("#inkPop").classList.toggle("on"));
document.addEventListener("click", e=>{
  if(!e.target.closest(".inkauth")) $("#inkPop")?.classList.remove("on");
});
$("#inkLoginBtn")?.addEventListener("click", async ()=>{
  if(!sb) return;
  const {error} = await sb.auth.signInWithPassword({email:$("#inkEm").value.trim(), password:$("#inkPw").value});
  if(error){ $("#inkErr").textContent = "로그인 실패 — " + error.message; return; }
  $("#inkErr").textContent = "";
  await inkRefresh();
});
$("#inkLogoutBtn")?.addEventListener("click", async ()=>{ if(sb){ await sb.auth.signOut(); await inkRefresh(); } });

/* ═══════════════════════════════════════════════
   정리 모드 — 과목·회차·문항 삭제
   삭제 단추는 항상 그려두고 CSS(body.manage)로만 보였다 숨긴다.
   로그인하지 않으면 스위치 자체를 켤 수 없고, 실제 권한은 서버(RLS)가 판단한다.
   ═══════════════════════════════════════════════ */
S.manage = false;
function setManage(on){
  S.manage = !!on && S.loggedIn;
  document.body.classList.toggle("manage", S.manage);
  const b = $("#manageBtn");
  if(b) b.textContent = S.manage ? "정리 모드 끄기" : "정리 모드 켜기";
}
$("#manageBtn")?.addEventListener("click", ()=> setManage(!S.manage));

/* 테이블 이름이 환경마다 다를 수 있어(뷰인지 원본 표인지) 후보를 차례로 시도한다 */
async function delTry(cands, build){
  let last = "";
  for(const t of cands){
    const {error} = await build(sb.from(t).delete());
    if(!error) return t;
    last = error.message || String(error);
  }
  throw new Error(last || "삭제하지 못했습니다");
}
const T_EXAM = ["exams","exam","exam_list"];
const T_SUBJ = ["subjects","subject","subject_list"];

/* 문항에 딸린 필기부터 지워야 외래키에 걸리지 않는다 */
async function wipeQuestions(examId){
  const {data:qs} = await sb.from("questions").select("id").eq("exam_id", examId);
  const ids = (qs||[]).map(q=>q.id);
  if(ids.length){
    for(let i=0;i<ids.length;i+=200)
      await sb.from("annotations").delete().in("question_id", ids.slice(i,i+200));
  }
  await delTry(["questions"], b => b.eq("exam_id", examId));
  ids.forEach(id => { delete S.anno[id]; delete S.hl[id]; delete S.stars[id]; delete S.seen[id]; });
  LS.set("hl",S.hl); LS.set("stars",S.stars); LS.set("seen",S.seen);
  return ids.length;
}
async function deleteExam(examId){
  const n = await wipeQuestions(examId);
  await delTry(T_EXAM, b => b.eq("id", examId));
  LS.set(`pos:${examId}`, 0);
  return n;
}
async function deleteSubject(subjectId){
  const {data:exs} = await sb.from("exam_list").select("id").eq("subject_id", subjectId);
  let n = 0;
  for(const e of (exs||[])) n += await deleteExam(e.id);
  await delTry(T_SUBJ, b => b.eq("id", subjectId));
  return n;
}
async function deleteQuestion(qid){
  await sb.from("annotations").delete().eq("question_id", qid);
  await delTry(["questions"], b => b.eq("id", qid));
  delete S.anno[qid]; delete S.hl[qid]; delete S.stars[qid]; delete S.seen[qid];
  LS.set("hl",S.hl); LS.set("stars",S.stars); LS.set("seen",S.seen);
}
/* 삭제는 되돌릴 수 없으니 한 번 더 묻는다 */
async function confirmDelete(label, run, after){
  if(!confirm(`${label}\n\n되돌릴 수 없습니다. 지울까요?`)) return;
  try{
    const n = await run();
    alert(typeof n === "number" ? `지웠습니다. (문항 ${n}개)` : "지웠습니다.");
    after?.();
  }catch(err){
    alert("지우지 못했습니다 — " + err.message +
      "\n\n로그인 계정에 삭제 권한(RLS)이 없거나, 표 이름이 다를 수 있습니다.");
  }
}

/* ═══════════════════════════════════════════════
   필기 — 저장/불러오기
   문항이 로드될 때 이 회차의 필기를 한 번에 가져온다 (문항마다 따로 요청하지 않음)
   ═══════════════════════════════════════════════ */
async function loadAnnotations(questionIds){
  if(!sb || !questionIds.length) return;
  const {data} = await sb.from("annotations").select("question_id,strokes,page_width").in("question_id", questionIds);
  (data||[]).forEach(r => S.anno[r.question_id] = {strokes:r.strokes||[], page_width:r.page_width||400});
}
const saveTimers = {};
function saveAnnotation(qid){
  clearTimeout(saveTimers[qid]);
  saveTimers[qid] = setTimeout(async ()=>{
    if(!sb) return;
    const a = S.anno[qid]; if(!a) return;
    const el = document.querySelector(`.inkpage[data-qid="${qid}"]`)
                 ?.closest(".sheet-body")?.querySelector(".itsave");
    if(el) el.textContent = "저장 중…";
    const {error} = await sb.from("annotations").upsert(
      { question_id: qid, strokes: a.strokes, page_width: a.page_width },
      { onConflict: "question_id" }
    );
    if(el) el.textContent = error ? "저장 실패" : "저장됨";
  }, 700);
}

/* ═══════════════════════════════════════════════
   필기 — 그리기 엔진
   좌표는 항상 "가상 페이지(400px 고정폭)" 안의 픽셀 단위로 저장한다.
   화면 폭이 바뀌면 이 페이지 전체를 scale() 로 키우고 줄일 뿐,
   글자는 절대 다시 줄바꿈되지 않으므로 잉크가 글자와 어긋나지 않는다.
   ═══════════════════════════════════════════════ */
const PAGE_W = 400;
const PALETTE = ["#E0342B","#1D4ED8","#10233D","#0EA05A"];
const HI_PALETTE = ["#FDE047","#86EFAC","#93C5FD","#FCA5A5"];

/* ── 두 손가락 핀치 확대/축소 (문항+해설 영역 공통, 필기 있든 없든) ──
   여기서는 브라우저의 zoom 속성을 쓰지 않는다. zoom 은 실제 레이아웃 크기까지
   바꿔서 필기가 쓰는 auto-fit 배율 계산과 두 번 겹쳐 계산될 위험이 있다.
   대신 순수 transform: translate() scale() 만 쓴다 — 이건 화면에 그려지는
   방식만 바꿀 뿐 실제 크기(clientWidth 등)는 안 바꾸므로, 안쪽의 필기 auto-fit
   로직과 서로 간섭하지 않는다. (getBoundingClientRect 는 이 변환들을 전부
   합쳐서 알려주므로, 펜 좌표 계산은 확대 배율에 관계없이 항상 정확하다.)

   손가락 개수로 완전히 딱 나눈다 — 예외 없음:
   · 손가락 둘 → 오직 확대/축소만.
   · 손가락 하나 → 오직 좌우 넘기기만. 확대된 상태여도 마찬가지.
     (확대해서 화면 밖으로 나간 부분을 보고 싶으면 손가락 둘로 다시 위치를 잡아 핀치하거나,
      더블탭/리셋 버튼으로 1배로 돌아온 뒤 다시 필요한 곳을 확대하면 된다) */
function setupZoom(zoomwrap, zoomstage){
  const pts = new Map();
  let zoom = 1, tx = 0, ty = 0;
  let startDist = 0, startZoom = 1, startMid = {x:0,y:0}, startTx = 0, startTy = 0;
  let lastTap = 0, dragStart = null;
  let panMode = false;   /* 이동(손) 도구가 켜졌을 때 true */
  const resetBtn = zoomwrap.querySelector(".zoomreset");

  /* 손도구로 직접 끌어 옮기는 상황(이동 도구 + 확대 상태)에서만 브라우저의 기본 스크롤을 끈다.
     그 외에는 pan-y 로 둬서 세로 스크롤은 늘 네이티브가 매끄럽게 처리하게 한다.
     (둘 다 켜져 있으면 한 번 끌 때 화면이 두 배로 움직인다) */
  function syncTouch(){
    zoomwrap.style.touchAction = (panMode && zoom > 1.02) ? "none" : "pan-y";
  }
  function apply(){
    zoomstage.style.transform = `translate(${tx}px,${ty}px) scale(${zoom})`;
    zoomwrap.classList.toggle("zoomed", zoom > 1.02);
    syncTouch();
  }
  function clamp(){
    const ww = zoomwrap.clientWidth, wh = zoomwrap.clientHeight;
    const sw = zoomstage.offsetWidth * zoom, sh = zoomstage.offsetHeight * zoom;
    const minTx = Math.min(0, ww - sw), maxTx = Math.max(0, ww - sw);
    const minTy = Math.min(0, wh - sh), maxTy = Math.max(0, wh - sh);
    tx = sw <= ww ? (ww - sw) / 2 : Math.min(maxTx, Math.max(minTx, tx));
    ty = sh <= wh ? Math.min(0, ty) : Math.min(maxTy, Math.max(minTy, ty));
  }
  function zoomAt(nz, ax, ay){
    nz = Math.min(3, Math.max(1, nz));
    const rect = zoomwrap.getBoundingClientRect();
    const px = (ax - rect.left - tx) / zoom;
    const py = (ay - rect.top  - ty) / zoom;
    zoom = nz;
    tx = ax - rect.left - px*zoom;
    ty = ay - rect.top  - py*zoom;
    clamp(); apply();
  }
  function resetZoom(){ zoom = 1; tx = 0; ty = 0; apply(); zoomwrap.classList.remove("zoomed"); }

  const track = $("#track");
  /* 필기 캔버스 위에서 시작한 한 손가락 동작은 "그리는 중"이므로 넘기기·끌기로 해석하면 안 된다.
     (가로로 밑줄을 긋다가 다음 문제로 넘어가 버리는 것을 막는다.)
     두 손가락 핀치는 그대로 살려둔다 — 필기 중에도 확대는 되어야 하니까. */
  const onInkCanvas = ev => !!ev.target?.classList?.contains?.("inkcanvas");
  /* 슬라이더나 단추 위에서 시작한 드래그도 마찬가지다. 그림 크기를 가로로 끄는 동작이
     "다음 문항으로 넘기기"로 읽히면 슬라이더를 아예 못 쓴다. */
  const onControl = ev => !!ev.target?.closest?.("input,button,select,textarea,[data-pasteq]");
  zoomwrap.addEventListener("pointerdown", ev=>{
    pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    if(pts.size === 1){
      dragStart = (onInkCanvas(ev) || onControl(ev)) ? null
        : {x:ev.clientX, y:ev.clientY, t:Date.now(), scrollLeft:track.scrollLeft, tx0:tx, ty0:ty};
    }
    if(pts.size === 2){
      dragStart = null; // 둘째 손가락이 닿으면 스와이프 판정은 취소하고 오직 핀치로만 다룬다
      const [a,b] = [...pts.values()];
      startDist = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      startZoom = zoom; startTx = tx; startTy = ty;
      startMid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
    }
  });
  let dragMode = null; // null(방향 판정 전) | "h"(좌우 넘기기) | "v"(세로는 손 안 댐)

  zoomwrap.addEventListener("pointermove", ev=>{
    if(!pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});

    if(pts.size === 2){
      ev.preventDefault();
      const [a,b] = [...pts.values()];
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
      const rect = zoomwrap.getBoundingClientRect();
      const nz = Math.min(3, Math.max(1, startZoom * (dist/startDist)));
      const px = (startMid.x - rect.left - startTx) / startZoom;
      const py = (startMid.y - rect.top  - startTy) / startZoom;
      zoom = nz;
      tx = mid.x - rect.left - px*zoom;
      ty = mid.y - rect.top  - py*zoom;
      clamp(); apply();
      return;
    }

    /* 손가락 하나: 처음 8px 정도 움직일 때까지는 방향을 정하지 않는다(성급하게 가로로 단정 안 함).
       가로로 판정되면 그때부터 손가락을 실시간으로 따라 화면을 옮긴다 — 네이티브 스크롤처럼 */
    if(!dragStart) return;
    const dx = ev.clientX - dragStart.x, dy = ev.clientY - dragStart.y;

    /* 이동(손) 도구 + 확대 상태 → 한 손가락 드래그로 화면을 끌어 옮긴다.
       확대돼 있지 않으면 옮길 곳이 없으므로 평소대로(세로 스크롤 / 좌우 넘기기) 둔다. */
    if(panMode && zoom > 1.02){
      if(dragMode === null){
        if(Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
        dragMode = "pan";
      }
      if(dragMode === "pan"){
        ev.preventDefault();
        tx = dragStart.tx0 + dx; ty = dragStart.ty0 + dy;
        clamp(); apply();
        return;
      }
    }

    if(dragMode === null){
      /* 넘김 감도 — 마우스로 글자를 고르다가 툭하면 다음 문항으로 넘어가서 문턱을 올렸다.
         마우스는 손가락보다 미세하게 움직이므로 더 많이 끌어야 넘김으로 친다. */
      const MIN = ev.pointerType === "mouse" ? 34 : 18;
      if(Math.abs(dx) < MIN && Math.abs(dy) < MIN) return;
      if(track.classList.contains("vert")) dragMode = "v";
      /* 가로가 세로보다 확실히 우세할 때만 넘김으로 본다 (1.15배 → 1.6배) */
      else dragMode = Math.abs(dx) > Math.abs(dy) * 1.6 ? "h" : "v";
    }
    if(dragMode === "h"){
      ev.preventDefault();
      track.scrollLeft = dragStart.scrollLeft - dx;
    }
    /* dragMode === "v" 면 아무것도 안 하고 그대로 둔다 — 세로 스크롤은 늘 네이티브가 처리 */
  }, {passive:false});

  function release(ev){
    pts.delete(ev.pointerId);
    if(pts.size) return; // 아직 손가락이 남아있으면 아무 판정도 하지 않는다

    if(dragMode === "h" && dragStart){
      /* 놓을 때 속도까지 봐서, 살짝만 밀어도 빠르게 밀었으면 넘어가지도록 */
      const dx = ev.clientX - dragStart.x;
      const dt = Math.max(1, Date.now() - dragStart.t);
      const vx = dx / dt;
      const w = track.clientWidth || 1;
      let target = S.idx;
      /* 넘어가는 데 필요한 거리·속도도 올렸다 (화면 폭의 18% → 32%, 속도 0.35 → 0.75) */
      const mouse = ev.pointerType === "mouse";
      if(Math.abs(dx) > w*(mouse ? 0.32 : 0.24) || Math.abs(vx) > (mouse ? 0.75 : 0.5)){
        target = dx < 0 ? Math.min(S.idx+1, S.questions.length-1) : Math.max(S.idx-1, 0);
      }
      jump(target); // 가장 가까운 문항으로 부드럽게 스냅 (안 넘어가도 제자리로 스냅됨)
    }
    const moved = dragStart ? Math.hypot(ev.clientX - dragStart.x, ev.clientY - dragStart.y) : 0;
    const wasDrag = dragMode !== null;
    dragStart = null; dragMode = null;

    /* 끌어서 옮긴 동작은 탭으로 세지 않는다 — 안 그러면 두 번 끌었을 때 더블탭으로 오인된다 */
    if(wasDrag || moved > 10){ lastTap = 0; return; }
    const now = Date.now();
    if(now - lastTap < 320){ zoom>1.02 ? resetZoom() : zoomAt(2, ev.clientX, ev.clientY); }
    lastTap = now;
  }
  zoomwrap.addEventListener("pointerup", release);
  zoomwrap.addEventListener("pointercancel", ()=>{ pts.clear(); dragStart = null; dragMode = null; });
  resetBtn?.addEventListener("click", e=>{ e.stopPropagation(); resetZoom(); });
  new ResizeObserver(()=>{ if(zoom>1){ clamp(); apply(); } }).observe(zoomwrap);

  return {
    setPan(on){ panMode = !!on; zoomwrap.classList.toggle("panmode", panMode); syncTouch(); },
    reset: resetZoom,
    get zoom(){ return zoom; }
  };
}


function setupInkPage(qid, wrap, page, canvas, tools, onEditingChange, zoomCtl){
  const ctx = canvas.getContext("2d");
  const state = { tool:"pen", color:PALETTE[0], hiColor:HI_PALETTE[0], editing:false, drawing:false, cur:null,
                  opa:{ pen:1, hi:1, ul:1 } };   // 도구별 진하기(0~1) — 각각 따로 기억한다

  function factor(){ return wrap.clientWidth / PAGE_W; }

  function resize(){
    const f = factor();
    const h = page.scrollHeight;
    page.style.transform = `scale(${f})`;
    canvas.style.transform = `scale(${f})`;
    canvas.width = PAGE_W; canvas.height = h;
    canvas.style.width = PAGE_W + "px"; canvas.style.height = h + "px";
    wrap.style.height = Math.round(h * f) + "px";
    redraw();
  }
  new ResizeObserver(resize).observe(wrap);
  new ResizeObserver(resize).observe(page);

  function strokeStyle(s){
    /* 획마다 저장된 진하기(opa, 0~1)가 있으면 그것을 쓴다.
       예전에 저장한 획에는 이 값이 없으므로, 그때의 기본값을 그대로 적용해 그림이 바뀌지 않게 한다. */
    const base = s.tool === "hi" ? 0.42 : 1;
    const alpha = (s.opa != null ? s.opa : 1) * base;
    if(s.tool === "hi") return { alpha, w:s.w||22, cap:"square" };
    if(s.tool === "ul") return { alpha, w:s.w||3,  cap:"round" };
    return { alpha, w:s.w||2.4, cap:"round" };
  }
  function redraw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const strokes = (S.anno[qid]?.strokes)||[];
    for(const s of strokes) paintStroke(s);
  }
  function paintStroke(s){
    if(!s.pts || s.pts.length < 2) return;
    const st = strokeStyle(s);
    ctx.globalAlpha = st.alpha;
    ctx.strokeStyle = s.color;
    ctx.lineJoin = "round"; ctx.lineCap = st.cap;
    ctx.beginPath();
    ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    for(let i=1;i<s.pts.length;i++){
      const p = s.pts[i];
      ctx.lineWidth = st.w * (s.tool==="pen" ? (p[2]!=null ? 0.6+p[2]*1.2 : 1) : 1);
      ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function toVirtual(ev){
    const r = canvas.getBoundingClientRect();
    const f = factor();
    return [ (ev.clientX - r.left)/f, (ev.clientY - r.top)/f, ev.pressure || 0.5 ];
  }
  function ensureAnno(){
    if(!S.anno[qid]) S.anno[qid] = { strokes:[], page_width:PAGE_W };
    return S.anno[qid];
  }
  function eraseNear(vx, vy){
    const a = ensureAnno();
    const R = 14;
    const before = a.strokes.length;
    a.strokes = a.strokes.filter(s => !(s.pts||[]).some(p => Math.hypot(p[0]-vx, p[1]-vy) < R));
    if(a.strokes.length !== before){ redraw(); saveAnnotation(qid); }
  }

  /* ── 그은 채로 1초 멈추면 직선으로 펴주기 ──────────────────────
     손을 떼지 않고 제자리에 약 1초 있으면, 지금까지 그은 획을 "시작점 → 지금 위치" 직선으로 바꾼다.
     그 뒤로는 손가락을 따라 끝점만 움직이므로, 자를 대고 긋는 것처럼 각도를 맞춘 뒤 떼면 된다.
     (펜·형광펜에만 적용. 밑줄은 원래 직선이고, 지우개는 해당 없음) */
  const HOLD_MS = 900, HOLD_MOVE = 2.5;
  let holdTimer = null, straight = false;
  function clearHold(){ clearTimeout(holdTimer); holdTimer = null; }
  function armHold(){
    clearHold();
    if(state.tool !== "pen" && state.tool !== "hi") return;
    holdTimer = setTimeout(()=>{
      if(!state.drawing || !state.cur || state.cur.pts.length < 2) return;
      const pts = state.cur.pts;
      state.cur.pts = [pts[0], pts[pts.length-1]];
      straight = true;
      redraw(); paintStroke(state.cur);
      try{ navigator.vibrate?.(12); }catch(e){}   /* 직선으로 바뀐 순간을 손끝으로 알려준다 */
    }, HOLD_MS);
  }

  canvas.addEventListener("pointerdown", ev=>{
    if(!state.editing) return;
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    straight = false; clearHold();
    if(state.tool === "er"){ state.drawing = true; eraseNear(...toVirtual(ev).slice(0,2)); return; }
    state.drawing = true;
    const col = state.tool === "hi" ? state.hiColor : state.color;
    state.cur = { tool: state.tool, color: col, w: strokeStyle({tool:state.tool}).w,
                  opa: state.opa[state.tool] ?? 1, pts:[toVirtual(ev)] };
    armHold();
  });
  canvas.addEventListener("pointermove", ev=>{
    if(!state.editing || !state.drawing) return;
    if(state.tool === "er"){ eraseNear(...toVirtual(ev).slice(0,2)); return; }
    const v = toVirtual(ev);

    if(straight){
      /* 이미 직선으로 바뀐 뒤 — 끝점만 따라간다. 잔상이 남지 않게 전체를 다시 그린다 */
      state.cur.pts[1] = v;
      redraw(); paintStroke(state.cur);
      return;
    }
    const last = state.cur.pts[state.cur.pts.length-1];
    state.cur.pts.push(v);
    paintStroke(state.cur); // 진행 중인 획을 즉시 눈에 보이게
    /* 실제로 움직였을 때만 대기 시간을 리셋한다 — 손을 멈추면 그때부터 1초를 센다 */
    if(Math.hypot(v[0]-last[0], v[1]-last[1]) > HOLD_MOVE) armHold();
  });
  function finish(){
    clearHold();
    if(!state.drawing) return;
    state.drawing = false;
    straight = false;
    if(state.tool === "er"){ return; }
    if(state.cur && state.cur.pts.length >= 2){
      if(state.tool === "ul"){
        const pts = state.cur.pts;
        const y = pts.reduce((s,p)=>s+p[1],0)/pts.length;
        state.cur.pts = [[pts[0][0], y],[pts[pts.length-1][0], y]];
      }
      ensureAnno().strokes.push(state.cur);
      redraw();
      saveAnnotation(qid);
    }
    state.cur = null;
  }
  canvas.addEventListener("pointerup", finish);
  canvas.addEventListener("pointercancel", finish);
  canvas.addEventListener("pointerleave", ()=>{ if(state.tool!=="er") finish(); });

  /* ── 도구 전환 ──
     "move"(이동) 는 그리는 도구가 아니라 손도구다. 이때는 캔버스가 아예 터치를 안 받게 해서
     (pointer-events:none) 필기 모드에 들어와 있어도 평소처럼 세로 스크롤·좌우 넘기기·핀치 확대가
     그대로 되고, 확대돼 있으면 한 손가락으로 화면을 끌어 옮길 수 있다. */
  function syncPointer(){
    const drawing = state.editing && state.tool !== "move";
    canvas.style.pointerEvents = drawing ? "auto" : "none";
    canvas.classList.toggle("edit", drawing);
    zoomCtl?.setPan(state.editing && state.tool === "move");
  }
  function setTool(name){
    if(!name) return;
    state.tool = name;
    tools.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on", x.dataset.tool===name));
    clearHold();
    if(state.drawing){ state.drawing = false; state.cur = null; straight = false; redraw(); }
    syncPointer();
    syncOpa();
  }
  tools.querySelectorAll("[data-tool]").forEach(b=>{
    b.onclick = ()=> setTool(b.dataset.tool);
  });

  /* 진하기 슬라이더 — 도구별로 값을 따로 기억하고, 도구를 바꾸면 그 도구의 값을 다시 보여준다.
     이미 그린 획은 건드리지 않는다(획마다 그릴 때의 진하기가 저장돼 있다). */
  const opaEl = tools.querySelector("[data-opa]");
  const opaVal = tools.querySelector("[data-opaval]");
  function syncOpa(){
    if(!opaEl) return;
    const t = (state.tool === "er") ? "pen" : state.tool;   // 지우개엔 진하기가 없다
    const v = Math.round((state.opa[t] ?? 1) * 100);
    opaEl.value = v;
    if(opaVal) opaVal.textContent = v + "%";
    opaEl.disabled = state.tool === "er";
    tools.querySelector(".itopa")?.style.setProperty("opacity", state.tool === "er" ? ".45" : "1");
  }
  opaEl?.addEventListener("input", ()=>{
    const t = (state.tool === "er") ? "pen" : state.tool;
    state.opa[t] = (+opaEl.value) / 100;
    if(opaVal) opaVal.textContent = opaEl.value + "%";
  });
  tools.querySelectorAll("[data-color]").forEach(b=>{
    b.style.background = b.dataset.color;
    b.onclick = ()=>{
      if(b.dataset.kind === "hi") state.hiColor = b.dataset.color; else state.color = b.dataset.color;
      tools.querySelectorAll(`[data-kind="${b.dataset.kind}"]`).forEach(x=>x.classList.toggle("on", x===b));
    };
  });
  tools.querySelector("[data-undo]").onclick = ()=>{
    const a = ensureAnno(); a.strokes.pop(); redraw(); saveAnnotation(qid);
  };
  tools.querySelector("[data-clear]").onclick = ()=>{
    if(!confirm("이 문항의 필기를 전부 지울까요?")) return;
    ensureAnno().strokes = []; redraw(); saveAnnotation(qid);
  };
  tools.querySelector("[data-close]").onclick = ()=> setEditing(false);

  /* silent=true 면 바깥에 알리지 않는다.
     처음 만들 때의 setEditing(false) 까지 바깥에 전해지면, "필기가 없으면 원래 카드로 되돌리기"가
     곧바로 발동해서 방금 만든 필기 페이지를 도로 부숴버린다. 초기화는 조용히 지나가야 한다. */
  function setEditing(on, silent){
    state.editing = on && S.loggedIn;
    tools.style.display = state.editing ? "flex" : "none";
    wrap.closest(".slide")?.classList.toggle("ink-editing", state.editing);
    if(!state.editing) zoomCtl?.setPan(false);
    syncPointer();
    if(!silent) onEditingChange?.(state.editing);
  }
  setEditing(false, true);
  syncOpa();
  resize();

  return { setEditing, setTool, redraw, resize, get editing(){ return state.editing; } };
}

/* ── 아주 작은 마크다운 (LaTeX 안 건드림) ── */
/* GFM 스타일 파이프 표(| a | b |\n|---|---|\n| 1 | 2 |) 를 인식해서 <table> 로 바꾼다.
   표가 아니면 null 을 돌려주므로, 호출하는 쪽에서 표가 아닌 다른 처리로 넘어간다. */
function tryTable(block){
  const lines = block.split("\n").filter(l => l.trim());
  if(lines.length < 2) return null;
  const isRow = l => /^\s*\|/.test(l);
  if(!isRow(lines[0])) return null;
  if(!/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[1]) || !/-{2,}/.test(lines[1])) return null;
  const splitRow = l => l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  const header = splitRow(lines[0]);
  const rows = lines.slice(2).filter(isRow).map(splitRow);
  if(!rows.length) return null;
  let html = '<div class="mdtable"><table><thead><tr>' +
    header.map(h=>`<th>${h}</th>`).join("") + "</tr></thead><tbody>";
  for(const r of rows) html += "<tr>" + r.map(c=>`<td>${c}</td>`).join("") + "</tr>";
  html += "</tbody></table></div>";
  return html;
}
/* 그림 주소만 허용한다 — http(s) 와 data:image 뿐. javascript: 같은 건 통째로 버린다 */
function safeURL(u){
  const s = String(u||"").trim().replace(/&amp;/g,"&");
  return /^(https?:\/\/|data:image\/)/i.test(s) ? s : "";
}
function md(src){
  if(!src) return "";
  const keep=[];                       /* 원문 그대로 살려둘 조각(수식·그림·SVG) */
  const stash = m => `\u0000${keep.push(m)-1}\u0000`;
  let s = String(src);

  /* ① SVG 는 먼저 통째로 빼둔다 — esc 를 거치면 글자로 보여버린다.
        (자동 변환에서 우리 파이프라인이 만든 그림만 들어오는 자리다) */
  s = s.replace(/<svg[\s\S]*?<\/svg>/gi, m => stash(m));

  s = esc(s);

  /* ② 수식 */
  s = s.replace(/\$\$[\s\S]*?\$\$|\$[^$\n]+?\$/g, m=>stash(m));

  /* ③ 그림  ![설명](주소)  — 링크보다 먼저 처리해야 한다 */
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m,alt,url)=>{
    const u = safeURL(url);
    return u ? stash(`<img class="qimg" src="${u}" alt="${alt}" loading="lazy">`) : "";
  });
  /* ④ 링크  [글자](주소) */
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,txt,url)=>{
    const u = safeURL(url);
    return u ? stash(`<a href="${u}" target="_blank" rel="noopener">${txt}</a>`) : txt;
  });

  s = s.replace(/`([^`]+)`/g,"<code>$1</code>")
       .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
       .replace(/^---$/gm,"<hr>");
  s = s.split(/\n{2,}/).map(block=>{
    const table = tryTable(block);
    if(table) return table;
    if(/^\s*[-•]\s/m.test(block) && block.split("\n").every(l=>/^\s*[-•]\s/.test(l)||!l.trim()))
      return "<ul>"+block.split("\n").filter(l=>l.trim()).map(l=>`<li>${l.replace(/^\s*[-•]\s/,"")}</li>`).join("")+"</ul>";
    if(/^\s*\d+[.)]\s/.test(block) && block.split("\n").every(l=>/^\s*\d+[.)]\s/.test(l)||!l.trim()))
      return "<ol>"+block.split("\n").filter(l=>l.trim()).map(l=>`<li>${l.replace(/^\s*\d+[.)]\s/,"")}</li>`).join("")+"</ol>";
    if(block.startsWith("<hr>")) return block;
    return "<p>"+block.replace(/\n/g,"<br>")+"</p>";
  }).join("");
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>keep[i]);
}
/* 자동 변환이 수식 구분자($)를 빠뜨리고 LaTeX 만 넣어 둔 문항이 있다. 그러면 KaTeX 가
   수식인 줄 모르고 지나가서 \frac{1}{\omega L} 이 글자 그대로 화면에 남는다.
   $ 가 하나도 없고 한글도 없는데 LaTeX 명령만 들어 있으면, 그 줄은 통째로 수식으로 본다.
   한글이 섞인 줄은 어디까지가 수식인지 확실치 않아 손대지 않는다 — 멀쩡한 문장을
   깨뜨리는 쪽이 더 나쁘다. */
const TEX_CMD = /\\(frac|dfrac|tfrac|sqrt|over|cdot|times|div|pm|mp|le|leq|ge|geq|neq|approx|equiv|propto|sum|prod|int|infty|partial|log|ln|exp|sin|cos|tan|alpha|beta|gamma|delta|epsilon|zeta|eta|theta|kappa|lambda|mu|nu|xi|rho|sigma|tau|phi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Xi|Pi|Sigma|Phi|Psi|Omega|left|right|begin|mathrm|mathbf|text|hat|bar|vec|dot|angle|circ)\b/;
function autoMath(s){
  const t = String(s ?? "").trim();
  if(!t || t.includes("$")) return s;
  if(/[가-힣]/.test(t)) return s;              /* 한글이 섞이면 건드리지 않는다 */
  if(/<svg|!\[|\\begin\{tikzpicture\}/.test(t)) return s;   /* 그림·tikz 는 대상 아님 */
  if(!TEX_CMD.test(t)) return s;
  return "$" + t + "$";
}

const tex = el=>{
  if(!window.renderMathInElement) return;
  try{ renderMathInElement(el,{delimiters:[
    {left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},
    {left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}
  ],throwOnError:false,ignoredTags:["script","noscript","style","textarea","pre","code","svg"]}); }catch(e){}
};

/* ═══════════════════════════════════════════════
   형광펜 — 드래그로 고른 글자에 노란 밑칠
   ───────────────────────────────────────────────
   저장 형식: S.hl[문항id][블록키] = [[시작글자, 끝글자], …]
   블록키는 data-hl 값(q=문제, c0~c3=보기, x=해설)이고,
   글자 번호는 그 블록 안의 텍스트를 처음부터 이어 세었을 때의 위치다.
   수식(.katex)·svg 안은 아예 세지 않는다 — KaTeX 가 만드는 숨은 글자까지
   세면 라이브러리가 바뀔 때마다 밑칠 위치가 통째로 밀리기 때문이다.
   ═══════════════════════════════════════════════ */
S.hl = LS.get("hl", {});

const hlGet = (qid,key) => (S.hl[qid]||{})[key] || [];
function hlSet(qid, key, ranges){
  const bag = S.hl[qid] || (S.hl[qid] = {});
  if(ranges.length) bag[key] = ranges; else delete bag[key];
  if(!Object.keys(bag).length) delete S.hl[qid];
  LS.set("hl", S.hl);
}
function hlMerge(list){
  /* 형광펜끼리, 취소선끼리만 이어 붙인다. 종류가 다르면 겹쳐도 따로 남긴다. */
  const out = [];
  for(const kind of ["h", "s"]){
    const a = list.filter(r => (r[2] === "s" ? "s" : "h") === kind && r[1] > r[0])
                  .map(r => [r[0], r[1], kind]).sort((x, y) => x[0] - y[0]);
    for(const r of a){
      const last = out[out.length-1];
      if(last && last[2] === kind && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else out.push(r);
    }
  }
  return out;
}
function hlSubtract(ranges, s, e){
  const out = [];
  for(const r of ranges){
    const [a, b] = r, k = r[2] === "s" ? "s" : "h";
    if(b <= s || a >= e){ out.push([a, b, k]); continue; }
    if(a < s) out.push([a, s, k]);
    if(b > e) out.push([e, b, k]);
  }
  return out;
}

/* 블록 안의 텍스트 노드를 문서 순서대로, 글자 번호와 함께 모은다 */
function hlNodes(block){
  const out = [];
  const skip = ".katex, .katex-display, svg, script, style";
  const walk = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if(!p || p.closest(skip)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let pos = 0;
  for(let n = walk.nextNode(); n; n = walk.nextNode()){
    out.push({ node:n, start:pos, end:pos + n.nodeValue.length });
    pos += n.nodeValue.length;
  }
  return out;
}
/* 선택 지점(노드+오프셋)을 블록 안 글자 번호로 옮긴다.
   수식 안이나 블록 밖을 가리키면 문서 순서상 가장 가까운 경계로 잘라 붙인다. */
function hlPointAt(map, node, offset){
  for(const t of map) if(t.node === node) return t.start + offset;
  if(!map.length) return 0;
  const p = document.createRange();
  try{ p.setStart(node, offset); }catch(e){ return 0; }
  p.collapse(true);
  for(const t of map){
    const tr = document.createRange();
    tr.selectNodeContents(t.node);
    if(p.compareBoundaryPoints(Range.START_TO_START, tr) <= 0) return t.start;
  }
  return map[map.length-1].end;
}

/* 저장된 글자 범위대로 <mark> 를 다시 씌운다 */
function hlPaint(block, ranges){
  block.querySelectorAll("mark.hlm").forEach(m => {
    const p = m.parentNode;
    while(m.firstChild) p.insertBefore(m.firstChild, m);
    p.removeChild(m);
  });
  block.normalize();
  if(!ranges || !ranges.length) return;
  const map = hlNodes(block);

  /* 형광펜과 취소선이 겹칠 수 있으므로, 구간을 그냥 잘라 넣지 않고
     글자마다 어떤 표시가 걸렸는지 적어둔 뒤 같은 표시가 이어지는 만큼 한 번에 감싼다. */
  for(let i = map.length - 1; i >= 0; i--){
    const t = map[i], len = t.end - t.start;
    if(len <= 0) continue;
    const kinds = new Array(len).fill("");
    for(const r of ranges){
      const [s0, e0] = r, kind = r[2] === "s" ? "s" : "h";
      const a0 = Math.max(s0, t.start), b0 = Math.min(e0, t.end);
      for(let c = a0 - t.start; c < b0 - t.start; c++)
        if(!kinds[c].includes(kind)) kinds[c] += kind;
    }
    const runs = [];
    let c = 0;
    while(c < len){
      if(!kinds[c]){ c++; continue; }
      let j = c; while(j < len && kinds[j] === kinds[c]) j++;
      runs.push([c, j, kinds[c]]); c = j;
    }
    runs.sort((x, y) => y[0] - x[0]);          // 뒤에서부터 잘라야 앞 글자 번호가 안 흔들린다
    for(const [a1, b1, kind] of runs){
      const node = t.node;
      if(b1 < node.nodeValue.length) node.splitText(b1);
      const target = a1 > 0 ? node.splitText(a1) : node;
      const mk = document.createElement("mark");
      mk.className = "hlm" + (kind.includes("h") ? " hl" : "") + (kind.includes("s") ? " st" : "");
      target.parentNode.replaceChild(mk, target);
      mk.appendChild(target);
    }
  }
}
/* 새로 그린 문항에 저장된 형광펜을 입힌다 — tex() 뒤에 부른다 */
function hlApply(root){
  root?.querySelectorAll("[data-hl]").forEach(b => {
    try{ hlPaint(b, hlGet(b.dataset.qid, b.dataset.hl)); }catch(e){}
  });
}

/* ── 말풍선 ── */
let HLSEL = null;
function hlHide(){ $("#hlbar")?.classList.remove("on"); HLSEL = null; }
function hlShow(rect, canDelete, canAdd = true){
  const bar = $("#hlbar"); if(!bar) return;
  $("#hlAdd").hidden = !canAdd;
  $("#hlStrike").hidden = !canAdd;
  $("#hlDel").hidden = !canDelete;
  bar.classList.add("on");
  const w = bar.offsetWidth, h = bar.offsetHeight;
  let x = rect.left + rect.width/2 - w/2;
  x = Math.max(10, Math.min(innerWidth - w - 10, x));
  /* 기본은 선택 영역 아래 — 브라우저 기본 메뉴(복사·공유)는 보통 위에 뜨므로 겹치지 않게 */
  let y = rect.bottom + 10;
  if(y + h > innerHeight - 12) y = Math.max(10, rect.top - h - 10);
  bar.style.left = x + "px";
  bar.style.top  = y + "px";
}
const hlEl = n => n && (n.nodeType === 1 ? n : n.parentElement);

let hlTimer = 0, HLBUSY = false;
document.addEventListener("selectionchange", ()=>{
  clearTimeout(hlTimer);
  hlTimer = setTimeout(()=>{ if(!HLBUSY) hlFromSelection(); }, 130);
});
function hlFromSelection(){
  const sel = getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return hlHide();
  const r = sel.getRangeAt(0);
  const block = hlEl(r.commonAncestorContainer)?.closest("[data-hl]")
             || hlEl(r.startContainer)?.closest("[data-hl]");
  if(!block || !block.dataset.qid) return hlHide();
  const map = hlNodes(block);
  let s = hlPointAt(map, r.startContainer, r.startOffset);
  let e = hlPointAt(map, r.endContainer, r.endOffset);
  if(e < s) [s,e] = [e,s];
  if(e <= s) return hlHide();
  const qid = block.dataset.qid, key = block.dataset.hl;
  HLSEL = { qid, key, s, e, block };
  hlShow(r.getBoundingClientRect(), hlGet(qid,key).some(([a,b]) => a < e && b > s));
}

/* 이미 칠해둔 곳을 그냥 눌렀을 때 — 지우기만 띄운다 */
document.addEventListener("click", e=>{
  if(e.target.closest?.(".hlbar")) return;
  const mk = e.target.closest?.("mark.hl");
  if(!mk){ if(getSelection()?.isCollapsed !== false) hlHide(); return; }
  const block = mk.closest("[data-hl]"); if(!block || !block.dataset.qid) return;
  const inside = hlNodes(block).filter(t => mk.contains(t.node));
  if(!inside.length) return;
  HLSEL = { qid:block.dataset.qid, key:block.dataset.hl,
            s:inside[0].start, e:inside[inside.length-1].end, block };
  hlShow(mk.getBoundingClientRect(), true, false);
});

/* 말풍선을 누르는 동안에는 선택이 풀려도 말풍선을 닫지 않는다.
   (누르는 순간 선택이 해제되면서 버튼이 사라져 클릭이 안 먹는 걸 막는다.
    실제 동작에 필요한 값은 이미 HLSEL 에 담아뒀으므로 선택이 풀려도 상관없다.) */
document.addEventListener("pointerdown", e=>{
  if(!e.target.closest?.(".hlbar")) return;
  HLBUSY = true;
  if(e.pointerType === "mouse") e.preventDefault();   // 데스크톱은 선택을 그대로 둔 채 누를 수 있다
}, true);
document.addEventListener("pointerup", ()=>{ setTimeout(()=>{ HLBUSY = false; }, 350); }, true);
addEventListener("scroll", ()=>{ if(HLSEL && !HLBUSY) hlHide(); }, true);
addEventListener("resize", hlHide);

$("#hlAdd")?.addEventListener("click", ()=>{
  if(!HLSEL) return;
  const {qid,key,s,e,block} = HLSEL;
  hlSet(qid, key, hlMerge([...hlGet(qid,key), [s,e]]));
  hlPaint(block, hlGet(qid,key));
  getSelection()?.removeAllRanges();
  hlHide();
});
$("#hlStrike")?.addEventListener("click", ()=>{
  if(!HLSEL) return;
  const {qid,key,s,e,block} = HLSEL;
  hlSet(qid, key, hlMerge([...hlGet(qid,key), [s,e,"s"]]));
  hlPaint(block, hlGet(qid,key));
  getSelection()?.removeAllRanges();
  hlHide();
});
$("#hlDel")?.addEventListener("click", ()=>{
  if(!HLSEL) return;
  const {qid,key,s,e,block} = HLSEL;
  hlSet(qid, key, hlSubtract(hlGet(qid,key), s, e));
  hlPaint(block, hlGet(qid,key));
  getSelection()?.removeAllRanges();
  hlHide();
});

function go(hash){ location.hash = hash; }
function show(id){
  $$(".view").forEach(v=>v.classList.toggle("on", v.id===id));
  const study = id==="v-study";
  $("#veilBtn").hidden = !study;
  $("#layoutBtn").hidden = !study;

  /* 다시 뽑기 버튼은 섞어 보기 덱을 볼 때만 띄운다.
     버튼은 HTML 에 붙박이로 두고 숨기기만 한다 — 지웠다 만들었다 하면
     지운 뒤에 다시 읽는 코드에서 바로 터진다(실제로 그래서 화면이 통째로 멈췄다). */
  const rr = document.getElementById("reroll");
  if(rr) rr.hidden = !(study && S.exam?._mix);
  document.body.style.overflow = study ? "hidden" : "";
}
window.addEventListener("hashchange", route);

async function route(){
  const h = (location.hash||"#/").slice(1);
  const [,a,b,c] = h.split("/");
  if(!sb) return viewSubjects();
  if(a==="s")        await viewExams(+b);
  else if(a==="e")   await viewStudy(+b, c?+c:null);
  else if(a==="mix") await viewMix(+b, c || "random");
  else               await viewSubjects();
}
$("#back").onclick = ()=>{
  const h=(location.hash||"#/").slice(1).split("/");
  if((h[1]==="e" || h[1]==="mix") && S.subject) go(`#/s/${S.subject.id}`);
  else go("#/");
};

    <button class="mixb s" data-mode="silver">은<span class="c" data-c="silver"></span></button>

  $$("#exams .mixb").forEach(b=>b.onclick=()=>go(`#/mix/${subjectId}/${b.dataset.mode}`));
  /* 시험 정보는 누를 때 처음 한 번만 계산한다 — 회차 목록이 뜨는 속도를 늦추지 않게 */

      e.stopPropagation();
      return confirmDelete(`"${name}" 의 문항을 전부 지웁니다. 회차 칸은 남습니다.`,
        ()=>wipeQuestions(+w.dataset.wipe),
        ()=>{ S.exam=null; S.questions=[]; viewExams(S.subject.id); });
    }
    if(d){
      e.stopPropagation();
      return confirmDelete(`"${name}" 회차를 문항까지 통째로 지웁니다.`,
        ()=>deleteExam(+d.dataset.delexam),
        ()=>{ S.exam=null; S.questions=[]; S.subjects=[]; viewExams(S.subject.id); });
    }
    go(`#/e/${b.dataset.id}`);
  });
}

/* ═══════════════════════════════════════════════
   시험 정보 · 출제경향
   시험 제도가 바뀐 시점 같은 건 어딘가에 적어 두면 과목이 늘 때마다 손으로 고쳐야 하고,
   틀린 채로 남으면 오히려 해가 된다. 그래서 아무것도 적어 두지 않고
   올려둔 회차의 과목 구성이 어디서 갈라지는지를 그때그때 읽어 낸다.
   ═══════════════════════════════════════════════ */

/* "3과목 : 시운전 및 안전관리" → {i:3, name:"시운전 및 안전관리"} */
function partOf(s){
  const t = String(s ?? "").trim();
  if(!t) return null;
  const m = t.match(/^(\d{1,2})\s*과목\s*[:·.\-]?\s*(.*)$/);
  return m ? { i:+m[1], name:(m[2] || `${m[1]}과목`).trim() } : { i:99, name:t };
}

/* 가진 번호에서 빠진 구간만 짧게 — [1,2,3,5,9] , 10 → "4, 6~8, 10" */
function missingRanges(nums, max){
  const set = new Set(nums), out = [];
  let s = null;
  for(let n = 1; n <= max; n++){
    if(!set.has(n)){ if(s === null) s = n; }
    else if(s !== null){ out.push(s === n-1 ? `${s}` : `${s}~${n-1}`); s = null; }
  }
  if(s !== null) out.push(s === max ? `${s}` : `${s}~${max}`);
  return out;
}

async function buildExamInfo(subjectId, box){
  box.innerHTML = `<p>회차를 훑는 중…</p>`;

  const {data:exams, error:e1} = await sb.from("exam_list")
    .select("id,label,year,session,question_count").eq("subject_id", subjectId);
  if(e1 || !exams?.length) return void (box.innerHTML = `<p>회차를 읽지 못했습니다.</p>`);

  let qs = [];
  try{
    qs = await fetchAllRows("questions", "id,exam_id,number,subject_part",
                            q => q.in("exam_id", exams.map(e => e.id)));
  }catch(e){ return void (box.innerHTML = `<p>문항을 읽지 못했습니다 — ${esc(e.message || e)}</p>`); }

  /* ── 회차별로 모으기 ── */
  const byExam = new Map();
  exams.forEach(e => byExam.set(e.id, { ...e, nums:[], parts:new Map(), rows:0 }));
  (qs || []).forEach(q => {
    const b = byExam.get(q.exam_id);
    if(!b) return;
    b.rows++;
    if(q.number != null) b.nums.push(+q.number);
    const p = partOf(q.subject_part);
    if(p) b.parts.set(p.i, p.name);
  });
  byExam.forEach(b => {
    b.uniq  = new Set(b.nums).size;
    b.maxNo = b.nums.length ? Math.max(...b.nums) : 0;
    b.dup   = b.rows - b.uniq;
  });

  /* ── 과목 구성이 같은 연도끼리 묶는다. 갈라지는 지점이 곧 제도가 바뀐 해다 ── */
  const sig = b => [...b.parts.keys()].sort((x,y) => x-y).map(i => `${i}:${b.parts.get(i)}`).join(" / ");
  const chrono = [...byExam.values()].sort((a,b) => (a.year - b.year) || (a.session - b.session));
  const eras = [];
  chrono.forEach(b => {
    const s = sig(b);
    if(!s) return;                       /* 과목 정보가 없는 회차는 판단에서 뺀다 */
    const last = eras[eras.length - 1];
    if(last && last.sig === s){ last.to = b; last.ex.push(b); }
    else eras.push({ sig:s, from:b, to:b, ex:[b], parts:b.parts });
  });

  const newest = eras[eras.length - 1] || null;
  const eraCeil = e => Math.max(...e.ex.map(b => b.maxNo), 0);

  const eraHTML = [...eras].reverse().map(e => {
    const names = [...e.parts.keys()].sort((x,y) => x-y).map(i => esc(e.parts.get(i)));
    const span = e.from.year === e.to.year ? `${e.from.year}년` : `${e.from.year} ~ ${e.to.year}년`;
    return `<div class="era ${e === newest ? "now" : ""}">
      <div class="lab">${span}${e === newest ? `<span class="flag">지금 형식</span>` : ""}</div>
      <div class="txt"><b>${names.length}과목</b> · 번호는 <b>${eraCeil(e)}번</b>까지 확인됩니다<br>${names.join(" / ")}</div>
    </div>`;
  }).join("");

  const changed = eras.length > 1
    ? `<p><b>형식이 바뀐 해 — ${eras[eras.length-1].from.year}년.</b>
        그 이전 회차는 과목 구성 자체가 달라서 지금 시험과 그대로 맞물리지 않습니다.
        내용을 복습하는 데는 여전히 쓸모가 있지만, <b>과목별 비중과 문항 수는 다릅니다.</b>
        범위를 지금 시험에 맞추고 싶다면 ${eras[eras.length-1].from.year}년 이후 회차만 보시면 됩니다.</p>`
    : `<p>올려둔 회차 안에서는 과목 구성이 바뀐 적이 없습니다.</p>`;

  /* ── 빠진 번호 · 겹친 번호 ── */
  const ceilOf = b => {
    const e = eras.find(x => x.ex.includes(b));
    return Math.max(b.maxNo, e ? eraCeil(e) : 0);
  };
  const flawed = chrono.filter(b => b.rows).map(b => {
    const miss = missingRanges(b.nums, ceilOf(b));
    return { b, miss };
  }).filter(x => x.miss.length || x.b.dup > 0).reverse();

  const gapHTML = flawed.length
    ? flawed.map(({b, miss}) => `<div class="gapline"><b>${esc(b.label)}</b> — ${b.uniq}/${ceilOf(b)}번
        ${miss.length ? `· 빠짐 <span class="miss">${miss.join(", ")}</span>` : ""}
        ${b.dup > 0 ? `· 겹침 <span class="miss">${b.dup}개</span>` : ""}</div>`).join("")
    : `<p>빠지거나 겹친 번호가 없습니다.</p>`;

  /* ── 출제경향 — 지금 형식 회차만 본다 ── */
  let trendHTML = `<p>지금 형식의 회차가 아직 없습니다.</p>`;
  if(newest){
    const eraIds = new Set(newest.ex.map(b => b.id));
    const cnt = new Map();
    (qs || []).forEach(q => {
      if(!eraIds.has(q.exam_id)) return;
      const p = partOf(q.subject_part);
      if(p) cnt.set(p.i, (cnt.get(p.i) || 0) + 1);
    });
    const tot = [...cnt.values()].reduce((a, b) => a + b, 0) || 1;
    const bars = [...cnt.keys()].sort((x,y) => x-y).map(i => {
      const v = cnt.get(i), pc = v / tot * 100;
      return `<div class="barrow">
        <span class="nm">${esc(newest.parts.get(i) || i + "과목")}</span>
        <span class="tr"><span class="fl" style="width:${pc.toFixed(1)}%"></span></span>
        <span class="vv">${v}문항</span>
      </div>`;
    }).join("");

    /* 주제 묶음은 섞어보기가 이미 만들어 둔 것을 그대로 쓴다 — 같은 기준이어야 헷갈리지 않는다 */
    const ix = S._mix?.[subjectId];
    let chips = `<p>주제를 세려면 목록을 한 번 더 불러와야 합니다. 회차 목록으로 나갔다 들어와 주세요.</p>`;
    if(ix?.rows?.length){
      const g = new Map();
      ix.rows.forEach(r => {
        if(!eraIds.has(r.exam_id) || !r._key) return;
        const o = g.get(r._gid) || g.set(r._gid, { key:r._key, ex:new Set(), n:0 }).get(r._gid);
        o.ex.add(r.exam_id); o.n++;
      });
      const top = [...g.values()].filter(o => o.ex.size >= 2)
        .sort((a, b) => b.ex.size - a.ex.size || b.n - a.n).slice(0, 14);
      chips = top.length
        ? `<div class="topics">${top.map(o =>
            `<span class="topic">${esc(o.key)}<i>${o.ex.size}회차 · ${o.n}문항</i></span>`).join("")}</div>
           <p style="margin-top:9px">여러 회차에 되풀이해 나온 주제를 <b>회차 수</b> 순으로 세웠습니다.
             주제어는 그 묶음에서 가장 특징적인 낱말이라 어색해 보일 수 있는데, 묶음 자체는 문항끼리 실제로
             겹치는 낱말로 만들어집니다. 섞어보기의 금·은·동과 같은 기준입니다.</p>`
        : `<p>아직 되풀이해 나온 주제를 잡을 만큼 회차가 모이지 않았습니다.</p>`;
    }
    trendHTML = bars + `<div style="height:12px"></div>` + chips;
  }

  box.innerHTML = `
    <section>
      <h4>시험 형식</h4>
      ${eraHTML || `<p>과목 정보가 있는 회차가 없습니다.</p>`}
      ${changed}
    </section>
    <section>
      <h4>회차 점검</h4>
      ${gapHTML}
      <p style="margin-top:9px">빠진 번호는 아직 안 올라온 문항입니다. 자동 변환에서 그 쪽수만 다시 돌리면 채워집니다.
        겹침은 같은 번호가 두 번 들어간 것이라, 정리 모드에서 지워 주셔야 합니다.</p>
    </section>
    <section>
      <h4>출제경향 · 지금 형식 기준</h4>
      ${trendHTML}
    </section>`;
}
