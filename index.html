<script>
/* ═══════════════════════════════════════════════
   상태
   ═══════════════════════════════════════════════ */
const CFG = window.APP_CONFIG || {};
const sb = (window.supabase && CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("xxxx"))
  ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY)
  : null;

const LS = {
  get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let S = {
  subjects:[], exams:[], questions:[], exam:null, subject:null,
  idx:0, veil:LS.get("veil",false), stars:LS.get("stars",{}), seen:LS.get("seen",{}),
  layout:LS.get("layout","swipe-x"),
  loggedIn:false, anno:{}   // anno[question_id] = {strokes, page_width}
};

const $  = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 본문 맨 앞에 다시 붙어 있는 문항 번호("1. ", "23) ", "(4) ", "문제 5. ")를 지운다.
   화면 왼쪽에 이미 번호 배지가 따로 있으므로 중복이고, 예전에 올린 회차에도 남아 있어서
   저장된 값을 고치지 않고 화면에 그릴 때 걸러낸다.
   숫자 뒤에 반드시 공백이 와야만 지우므로 "1.5kg", "2단압축", "20℃" 같은 진짜 본문은 건드리지 않는다. */
function stripQNo(s){
  return String(s??"").replace(
    /^[\s\u00A0]*(?:문제|문항)?[\s\u00A0]*(?:[[(][\s\u00A0]*\d{1,3}[\s\u00A0]*[\])]|\d{1,3}[\s\u00A0]*[.)])[\s\u00A0]+/,
    ""
  );
}

/* ═══════════════════════════════════════════════
   필기 — 로그인
   ═══════════════════════════════════════════════ */
/* session 을 넘겨받으면 getSession() 을 부르지 않는다.
   onAuthStateChange 콜백 안에서 getSession() 을 부르면 잠금이 서로를 기다려 굳어버리기 때문이다. */
async function inkRefresh(session){
  if(!sb) return;
  const was = S.loggedIn;
  if(session === undefined){
    const {data} = await sb.auth.getSession();
    session = data.session;
  }
  S.loggedIn = !!session;
  $("#inkPopIn").hidden = S.loggedIn;
  $("#inkPopOut").hidden = !S.loggedIn;
  $("#inkAuthBtn").classList.toggle("on", S.loggedIn);
  $$(".qink").forEach(b => b.classList.toggle("loggedin", S.loggedIn));
  if(!S.loggedIn) setManage(false);
  /* 고치기 단추들은 로그인 여부를 보고 그릴지 말지를 정한다. 그래서 로그인 상태가
     바뀌면 이미 그려둔 문항을 다시 그려야 단추가 나타나거나 사라진다.
     필기 중인 문항은 건드리지 않는다 — 다시 그리면 그리던 획이 날아간다. */
  if(was !== S.loggedIn){
    redrawOpenCards();
    redrawOpenNotes();     /* 자료 패널은 문항 카드가 아니라서 위 함수가 못 건드린다 */
  }
}

/* 펼쳐져 있는 핵심개념 자료 패널을 다시 그린다.
   버튼은 로그인 여부와 무관하게 늘 그려지고 눌렀을 때 막는 구조라 없어도 동작은 하지만,
   로그인 직후 화면이 그대로면 "된 건가?" 싶어서 한 번 새로 그려 준다. */
function redrawOpenNotes(){
  const np = document.getElementById("notePanel");
  if(np && np.dataset.subject && np.dataset.open === "1") drawNotes(+np.dataset.subject, np);
}

function redrawOpenCards(){
  $$("#track .slide .sheet-body").forEach(body => {
    if(body.dataset.h !== "1" || body.__ink?.editing) return;
    body.dataset.h = "0"; body.__ink = null; body.__zoom = null;
    hydrate(+body.parentElement.dataset.i);
  });
}
$("#inkAuthBtn")?.addEventListener("click", ()=> $("#inkPop").classList.toggle("on"));
document.addEventListener("click", e=>{
  if(!e.target.closest(".inkauth")) $("#inkPop")?.classList.remove("on");
});
$("#inkLoginBtn")?.addEventListener("click", async ()=>{
  if(!sb) return;
  const {error} = await sb.auth.signInWithPassword({email:$("#inkEm").value.trim(), password:$("#inkPw").value});
  if(error){ $("#inkErr").textContent = "로그인 실패 — " + error.message; return; }
  $("#inkErr").textContent = "";
  $("#inkEm").value = ""; $("#inkPw").value = "";
  $("#inkPop")?.classList.remove("on");     /* 로그인됐으면 창을 닫아 준다 */
  await inkRefresh();
  toast("로그인했습니다. 이제 자료를 넣고 고칠 수 있습니다.");
});
$("#inkLogoutBtn")?.addEventListener("click", async ()=>{ if(sb){ await sb.auth.signOut(); await inkRefresh(); } });

/* ═══════════════════════════════════════════════
   정리 모드 — 과목·회차·문항 삭제
   삭제 단추는 항상 그려두고 CSS(body.manage)로만 보였다 숨긴다.
   로그인하지 않으면 스위치 자체를 켤 수 없고, 실제 권한은 서버(RLS)가 판단한다.
   ═══════════════════════════════════════════════ */
S.manage = false;
function setManage(on){
  S.manage = !!on && S.loggedIn;
  document.body.classList.toggle("manage", S.manage);
  const b = $("#manageBtn");
  if(b) b.textContent = S.manage ? "정리 모드 끄기" : "정리 모드 켜기";
}
$("#manageBtn")?.addEventListener("click", ()=> setManage(!S.manage));

/* 테이블 이름이 환경마다 다를 수 있어(뷰인지 원본 표인지) 후보를 차례로 시도한다 */
async function delTry(cands, build){
  let last = "";
  for(const t of cands){
    const {error} = await build(sb.from(t).delete());
    if(!error) return t;
    last = error.message || String(error);
  }
  throw new Error(last || "삭제하지 못했습니다");
}
const T_EXAM = ["exams","exam","exam_list"];
const T_SUBJ = ["subjects","subject","subject_list"];

/* 문항에 딸린 필기부터 지워야 외래키에 걸리지 않는다 */
async function wipeQuestions(examId){
  const {data:qs} = await sb.from("questions").select("id").eq("exam_id", examId);
  const ids = (qs||[]).map(q=>q.id);
  if(ids.length){
    for(let i=0;i<ids.length;i+=200)
      await sb.from("annotations").delete().in("question_id", ids.slice(i,i+200));
  }
  await delTry(["questions"], b => b.eq("exam_id", examId));
  ids.forEach(id => { delete S.anno[id]; delete S.hl[id]; delete S.stars[id]; delete S.seen[id]; });
  LS.set("hl",S.hl); LS.set("stars",S.stars); LS.set("seen",S.seen);
  return ids.length;
}
async function deleteExam(examId){
  const n = await wipeQuestions(examId);
  await delTry(T_EXAM, b => b.eq("id", examId));
  LS.set(`pos:${examId}`, 0);
  return n;
}
async function deleteSubject(subjectId){
  const {data:exs} = await sb.from("exam_list").select("id").eq("subject_id", subjectId);
  let n = 0;
  for(const e of (exs||[])) n += await deleteExam(e.id);
  await delTry(T_SUBJ, b => b.eq("id", subjectId));
  return n;
}
async function deleteQuestion(qid){
  await sb.from("annotations").delete().eq("question_id", qid);
  await delTry(["questions"], b => b.eq("id", qid));
  delete S.anno[qid]; delete S.hl[qid]; delete S.stars[qid]; delete S.seen[qid];
  LS.set("hl",S.hl); LS.set("stars",S.stars); LS.set("seen",S.seen);
}
/* 삭제는 되돌릴 수 없으니 한 번 더 묻는다 */
async function confirmDelete(label, run, after){
  if(!confirm(`${label}\n\n되돌릴 수 없습니다. 지울까요?`)) return;
  try{
    const n = await run();
    alert(typeof n === "number" ? `지웠습니다. (문항 ${n}개)` : "지웠습니다.");
    after?.();
  }catch(err){
    alert("지우지 못했습니다 — " + err.message +
      "\n\n로그인 계정에 삭제 권한(RLS)이 없거나, 표 이름이 다를 수 있습니다.");
  }
}

/* ═══════════════════════════════════════════════
   필기 — 저장/불러오기
   문항이 로드될 때 이 회차의 필기를 한 번에 가져온다 (문항마다 따로 요청하지 않음)
   ═══════════════════════════════════════════════ */
async function loadAnnotations(questionIds){
  if(!sb || !questionIds.length) return;
  const {data} = await sb.from("annotations").select("question_id,strokes,page_width").in("question_id", questionIds);
  (data||[]).forEach(r => S.anno[r.question_id] = {strokes:r.strokes||[], page_width:r.page_width||400});
}
const saveTimers = {};
function saveAnnotation(qid){
  clearTimeout(saveTimers[qid]);
  saveTimers[qid] = setTimeout(async ()=>{
    if(!sb) return;
    const a = S.anno[qid]; if(!a) return;
    const el = document.querySelector(`.inkpage[data-qid="${qid}"]`)
                 ?.closest(".sheet-body")?.querySelector(".itsave");
    if(el) el.textContent = "저장 중…";
    const {error} = await sb.from("annotations").upsert(
      { question_id: qid, strokes: a.strokes, page_width: a.page_width },
      { onConflict: "question_id" }
    );
    if(el) el.textContent = error ? "저장 실패" : "저장됨";
  }, 700);
}

/* ═══════════════════════════════════════════════
   필기 — 그리기 엔진
   좌표는 항상 "가상 페이지(400px 고정폭)" 안의 픽셀 단위로 저장한다.
   화면 폭이 바뀌면 이 페이지 전체를 scale() 로 키우고 줄일 뿐,
   글자는 절대 다시 줄바꿈되지 않으므로 잉크가 글자와 어긋나지 않는다.
   ═══════════════════════════════════════════════ */
const PAGE_W = 400;
const PALETTE = ["#E0342B","#1D4ED8","#10233D","#0EA05A"];
const HI_PALETTE = ["#FDE047","#86EFAC","#93C5FD","#FCA5A5"];

/* ── 두 손가락 핀치 확대/축소 (문항+해설 영역 공통, 필기 있든 없든) ──
   여기서는 브라우저의 zoom 속성을 쓰지 않는다. zoom 은 실제 레이아웃 크기까지
   바꿔서 필기가 쓰는 auto-fit 배율 계산과 두 번 겹쳐 계산될 위험이 있다.
   대신 순수 transform: translate() scale() 만 쓴다 — 이건 화면에 그려지는
   방식만 바꿀 뿐 실제 크기(clientWidth 등)는 안 바꾸므로, 안쪽의 필기 auto-fit
   로직과 서로 간섭하지 않는다. (getBoundingClientRect 는 이 변환들을 전부
   합쳐서 알려주므로, 펜 좌표 계산은 확대 배율에 관계없이 항상 정확하다.)

   손가락 개수로 완전히 딱 나눈다 — 예외 없음:
   · 손가락 둘 → 오직 확대/축소만.
   · 손가락 하나 → 오직 좌우 넘기기만. 확대된 상태여도 마찬가지.
     (확대해서 화면 밖으로 나간 부분을 보고 싶으면 손가락 둘로 다시 위치를 잡아 핀치하거나,
      더블탭/리셋 버튼으로 1배로 돌아온 뒤 다시 필요한 곳을 확대하면 된다) */
function setupZoom(zoomwrap, zoomstage){
  const pts = new Map();
  let zoom = 1, tx = 0, ty = 0;
  let startDist = 0, startZoom = 1, startMid = {x:0,y:0}, startTx = 0, startTy = 0;
  let lastTap = 0, dragStart = null;
  let panMode = false;   /* 이동(손) 도구가 켜졌을 때 true */
  const resetBtn = zoomwrap.querySelector(".zoomreset");

  /* 손도구로 직접 끌어 옮기는 상황(이동 도구 + 확대 상태)에서만 브라우저의 기본 스크롤을 끈다.
     그 외에는 pan-y 로 둬서 세로 스크롤은 늘 네이티브가 매끄럽게 처리하게 한다.
     (둘 다 켜져 있으면 한 번 끌 때 화면이 두 배로 움직인다) */
  function syncTouch(){
    zoomwrap.style.touchAction = (panMode && zoom > 1.02) ? "none" : "pan-y";
  }
  function apply(){
    zoomstage.style.transform = `translate(${tx}px,${ty}px) scale(${zoom})`;
    zoomwrap.classList.toggle("zoomed", zoom > 1.02);
    syncTouch();
  }
  function clamp(){
    const ww = zoomwrap.clientWidth, wh = zoomwrap.clientHeight;
    const sw = zoomstage.offsetWidth * zoom, sh = zoomstage.offsetHeight * zoom;
    const minTx = Math.min(0, ww - sw), maxTx = Math.max(0, ww - sw);
    const minTy = Math.min(0, wh - sh), maxTy = Math.max(0, wh - sh);
    tx = sw <= ww ? (ww - sw) / 2 : Math.min(maxTx, Math.max(minTx, tx));
    ty = sh <= wh ? Math.min(0, ty) : Math.min(maxTy, Math.max(minTy, ty));
  }
  function zoomAt(nz, ax, ay){
    nz = Math.min(3, Math.max(1, nz));
    const rect = zoomwrap.getBoundingClientRect();
    const px = (ax - rect.left - tx) / zoom;
    const py = (ay - rect.top  - ty) / zoom;
    zoom = nz;
    tx = ax - rect.left - px*zoom;
    ty = ay - rect.top  - py*zoom;
    clamp(); apply();
  }
  function resetZoom(){ zoom = 1; tx = 0; ty = 0; apply(); zoomwrap.classList.remove("zoomed"); }

  const track = $("#track");
  /* 필기 캔버스 위에서 시작한 한 손가락 동작은 "그리는 중"이므로 넘기기·끌기로 해석하면 안 된다.
     (가로로 밑줄을 긋다가 다음 문제로 넘어가 버리는 것을 막는다.)
     두 손가락 핀치는 그대로 살려둔다 — 필기 중에도 확대는 되어야 하니까. */
  const onInkCanvas = ev => !!ev.target?.classList?.contains?.("inkcanvas");
  /* 슬라이더나 단추 위에서 시작한 드래그도 마찬가지다. 그림 크기를 가로로 끄는 동작이
     "다음 문항으로 넘기기"로 읽히면 슬라이더를 아예 못 쓴다. */
  const onControl = ev => !!ev.target?.closest?.("input,button,select,textarea,[data-pasteq]");
  /* 마우스를 누른 자리가 «읽는 글» 위였는지 기억해 둔다.
     글 위에서 끄는 것은 형광펜을 칠하려는 것이고, 빈 자리에서 끄는 것은 넘기려는 것이다. */
  let MOUSE_ON_TEXT = false;
  zoomwrap.addEventListener("pointerdown", ev=>{
    if(ev.pointerType === "mouse")
      MOUSE_ON_TEXT = !!ev.target.closest?.(
        "[data-hl], .qtext, .exp-b, .eb, .opt, .opt .t, p, li, td, th, h2, h3, h4, code, mark");
    pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    if(pts.size === 1){
      dragStart = (onInkCanvas(ev) || onControl(ev)) ? null
        : {x:ev.clientX, y:ev.clientY, t:Date.now(), scrollLeft:track.scrollLeft, tx0:tx, ty0:ty};
    }
    if(pts.size === 2){
      dragStart = null; // 둘째 손가락이 닿으면 스와이프 판정은 취소하고 오직 핀치로만 다룬다
      const [a,b] = [...pts.values()];
      startDist = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      startZoom = zoom; startTx = tx; startTy = ty;
      startMid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
    }
  });
  let dragMode = null; // null(방향 판정 전) | "h"(좌우 넘기기) | "v"(세로는 손 안 댐)

  zoomwrap.addEventListener("pointermove", ev=>{
    if(!pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});

    if(pts.size === 2){
      ev.preventDefault();
      const [a,b] = [...pts.values()];
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
      const rect = zoomwrap.getBoundingClientRect();
      const nz = Math.min(3, Math.max(1, startZoom * (dist/startDist)));
      const px = (startMid.x - rect.left - startTx) / startZoom;
      const py = (startMid.y - rect.top  - startTy) / startZoom;
      zoom = nz;
      tx = mid.x - rect.left - px*zoom;
      ty = mid.y - rect.top  - py*zoom;
      clamp(); apply();
      return;
    }

    /* 손가락 하나: 처음 8px 정도 움직일 때까지는 방향을 정하지 않는다(성급하게 가로로 단정 안 함).
       가로로 판정되면 그때부터 손가락을 실시간으로 따라 화면을 옮긴다 — 네이티브 스크롤처럼 */
    if(!dragStart) return;
    const dx = ev.clientX - dragStart.x, dy = ev.clientY - dragStart.y;

    /* 이동(손) 도구 + 확대 상태 → 한 손가락 드래그로 화면을 끌어 옮긴다.
       확대돼 있지 않으면 옮길 곳이 없으므로 평소대로(세로 스크롤 / 좌우 넘기기) 둔다. */
    if(panMode && zoom > 1.02){
      if(dragMode === null){
        if(Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
        dragMode = "pan";
      }
      if(dragMode === "pan"){
        ev.preventDefault();
        tx = dragStart.tx0 + dx; ty = dragStart.ty0 + dy;
        clamp(); apply();
        return;
      }
    }

    if(dragMode === null){
      /* ★ 마우스로 끄는 것은 «글자 고르기» 로만 쓴다.
         예전에는 조금만 가로로 끌어도 다음 문항으로 넘어가서, 형광펜 칠하려고 문장을
         끌면 화면이 넘어가 버렸다. 마우스는 이제 절대 넘김으로 읽지 않는다.
         손가락 스와이프는 그대로 살려 둔다 — 폰에서는 그게 제일 편하다.
         마우스로 넘길 때는 화면 좌우의 ‹ › 단추나 방향키를 쓰면 된다. */
      /* 마우스는 «글자 위» 에서 시작했을 때만 넘김에서 뺀다.
         빈 여백·그림 위에서 끄는 것은 넘길 뜻이므로 받아 준다.
         대신 문턱을 120px 로 크게 잡아, 살짝 흔든 것으로는 안 넘어가게 한다. */
      if(ev.pointerType === "mouse"){
        if(MOUSE_ON_TEXT){ dragMode = "v"; return; }
        if(Math.abs(dx) < 120 || Math.abs(dx) < Math.abs(dy) * 2){ return; }
        dragMode = "h";
        return;
      }
      const MIN = 18;
      if(Math.abs(dx) < MIN && Math.abs(dy) < MIN) return;
      if(track.classList.contains("vert")) dragMode = "v";
      /* 가로가 세로보다 확실히 우세할 때만 넘김으로 본다 */
      else dragMode = Math.abs(dx) > Math.abs(dy) * 1.6 ? "h" : "v";
    }
    if(dragMode === "h"){
      ev.preventDefault();
      track.scrollLeft = dragStart.scrollLeft - dx;
    }
    /* dragMode === "v" 면 아무것도 안 하고 그대로 둔다 — 세로 스크롤은 늘 네이티브가 처리 */
  }, {passive:false});

  function release(ev){
    pts.delete(ev.pointerId);
    if(pts.size) return; // 아직 손가락이 남아있으면 아무 판정도 하지 않는다

    if(dragMode === "h" && dragStart){
      /* 놓을 때 속도까지 봐서, 살짝만 밀어도 빠르게 밀었으면 넘어가지도록 */
      const dx = ev.clientX - dragStart.x;
      const dt = Math.max(1, Date.now() - dragStart.t);
      const vx = dx / dt;
      const w = track.clientWidth || 1;
      let target = S.idx;
      /* 넘어가는 데 필요한 거리·속도도 올렸다 (화면 폭의 18% → 32%, 속도 0.35 → 0.75) */
      const mouse = ev.pointerType === "mouse";
      if(Math.abs(dx) > w*(mouse ? 0.32 : 0.24) || Math.abs(vx) > (mouse ? 0.75 : 0.5)){
        target = dx < 0 ? Math.min(S.idx+1, S.questions.length-1) : Math.max(S.idx-1, 0);
      }
      jump(target); // 가장 가까운 문항으로 부드럽게 스냅 (안 넘어가도 제자리로 스냅됨)
    }
    const moved = dragStart ? Math.hypot(ev.clientX - dragStart.x, ev.clientY - dragStart.y) : 0;
    const wasDrag = dragMode !== null;
    dragStart = null; dragMode = null;

    /* 끌어서 옮긴 동작은 탭으로 세지 않는다 — 안 그러면 두 번 끌었을 때 더블탭으로 오인된다 */
    if(wasDrag || moved > 10){ lastTap = 0; return; }
    const now = Date.now();
    if(now - lastTap < 320){ zoom>1.02 ? resetZoom() : zoomAt(2, ev.clientX, ev.clientY); }
    lastTap = now;
  }
  zoomwrap.addEventListener("pointerup", release);
  zoomwrap.addEventListener("pointercancel", ()=>{ pts.clear(); dragStart = null; dragMode = null; });
  resetBtn?.addEventListener("click", e=>{ e.stopPropagation(); resetZoom(); });
  new ResizeObserver(()=>{ if(zoom>1){ clamp(); apply(); } }).observe(zoomwrap);

  return {
    setPan(on){ panMode = !!on; zoomwrap.classList.toggle("panmode", panMode); syncTouch(); },
    reset: resetZoom,
    get zoom(){ return zoom; }
  };
}


function setupInkPage(qid, wrap, page, canvas, tools, onEditingChange, zoomCtl){
  const ctx = canvas.getContext("2d");
  const state = { tool:"pen", color:PALETTE[0], hiColor:HI_PALETTE[0], editing:false, drawing:false, cur:null,
                  opa:{ pen:1, hi:1, ul:1 } };   // 도구별 진하기(0~1) — 각각 따로 기억한다

  function factor(){ return wrap.clientWidth / PAGE_W; }

  function resize(){
    const f = factor();
    const h = page.scrollHeight;
    page.style.transform = `scale(${f})`;
    canvas.style.transform = `scale(${f})`;
    canvas.width = PAGE_W; canvas.height = h;
    canvas.style.width = PAGE_W + "px"; canvas.style.height = h + "px";
    wrap.style.height = Math.round(h * f) + "px";
    redraw();
  }
  new ResizeObserver(resize).observe(wrap);
  new ResizeObserver(resize).observe(page);

  function strokeStyle(s){
    /* 획마다 저장된 진하기(opa, 0~1)가 있으면 그것을 쓴다.
       예전에 저장한 획에는 이 값이 없으므로, 그때의 기본값을 그대로 적용해 그림이 바뀌지 않게 한다. */
    const base = s.tool === "hi" ? 0.42 : 1;
    const alpha = (s.opa != null ? s.opa : 1) * base;
    if(s.tool === "hi") return { alpha, w:s.w||22, cap:"square" };
    if(s.tool === "ul") return { alpha, w:s.w||3,  cap:"round" };
    return { alpha, w:s.w||2.4, cap:"round" };
  }
  function redraw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const strokes = (S.anno[qid]?.strokes)||[];
    for(const s of strokes) paintStroke(s);
  }
  function paintStroke(s){
    if(!s.pts || s.pts.length < 2) return;
    const st = strokeStyle(s);
    ctx.globalAlpha = st.alpha;
    ctx.strokeStyle = s.color;
    ctx.lineJoin = "round"; ctx.lineCap = st.cap;
    ctx.beginPath();
    ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    for(let i=1;i<s.pts.length;i++){
      const p = s.pts[i];
      ctx.lineWidth = st.w * (s.tool==="pen" ? (p[2]!=null ? 0.6+p[2]*1.2 : 1) : 1);
      ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function toVirtual(ev){
    const r = canvas.getBoundingClientRect();
    const f = factor();
    return [ (ev.clientX - r.left)/f, (ev.clientY - r.top)/f, ev.pressure || 0.5 ];
  }
  function ensureAnno(){
    if(!S.anno[qid]) S.anno[qid] = { strokes:[], page_width:PAGE_W };
    return S.anno[qid];
  }
  function eraseNear(vx, vy){
    const a = ensureAnno();
    const R = 14;
    const before = a.strokes.length;
    a.strokes = a.strokes.filter(s => !(s.pts||[]).some(p => Math.hypot(p[0]-vx, p[1]-vy) < R));
    if(a.strokes.length !== before){ redraw(); saveAnnotation(qid); }
  }

  /* ── 그은 채로 1초 멈추면 직선으로 펴주기 ──────────────────────
     손을 떼지 않고 제자리에 약 1초 있으면, 지금까지 그은 획을 "시작점 → 지금 위치" 직선으로 바꾼다.
     그 뒤로는 손가락을 따라 끝점만 움직이므로, 자를 대고 긋는 것처럼 각도를 맞춘 뒤 떼면 된다.
     (펜·형광펜에만 적용. 밑줄은 원래 직선이고, 지우개는 해당 없음) */
  const HOLD_MS = 900, HOLD_MOVE = 2.5;
  let holdTimer = null, straight = false;
  function clearHold(){ clearTimeout(holdTimer); holdTimer = null; }
  function armHold(){
    clearHold();
    if(state.tool !== "pen" && state.tool !== "hi") return;
    holdTimer = setTimeout(()=>{
      if(!state.drawing || !state.cur || state.cur.pts.length < 2) return;
      const pts = state.cur.pts;
      state.cur.pts = [pts[0], pts[pts.length-1]];
      straight = true;
      redraw(); paintStroke(state.cur);
      try{ navigator.vibrate?.(12); }catch(e){}   /* 직선으로 바뀐 순간을 손끝으로 알려준다 */
    }, HOLD_MS);
  }

  /* ── 펜 뒤꼭지·지우개 버튼 ──
     태블릿 펜은 지우개 쪽으로 뒤집거나 옆 버튼을 누르면
     pointerdown 에 button 5 (buttons 비트 32) 를 실어 보낸다.
     그 획 동안만 지우개로 바꿔 쓰고, 손을 떼면 원래 도구로 돌려놓는다.
     (도구 단추를 눌러 지우개로 바꿨다가 다시 펜으로 되돌리는 수고를 없앤다) */
  const TOOLNAME = { pen:"펜", hi:"형광펜", ul:"밑줄", er:"지우개", move:"이동" };
  const isEraserBtn = ev => ev.pointerType === "pen" && (ev.button === 5 || (ev.buttons & 32) !== 0);
  let penErase = null;              // 잠시 지우개로 쓰는 동안 원래 도구를 넣어 둔다
  const markTool = name =>
    tools.querySelectorAll("[data-tool]").forEach(x => x.classList.toggle("on", x.dataset.tool === name));

  canvas.addEventListener("pointerdown", ev=>{
    if(!state.editing) return;
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    straight = false; clearHold();
    if(isEraserBtn(ev) && state.tool !== "er"){
      penErase = state.tool;
      state.tool = "er";
      markTool("er");
    }
    if(state.tool === "er"){ state.drawing = true; eraseNear(...toVirtual(ev).slice(0,2)); return; }
    state.drawing = true;
    const col = state.tool === "hi" ? state.hiColor : state.color;
    state.cur = { tool: state.tool, color: col, w: strokeStyle({tool:state.tool}).w,
                  opa: state.opa[state.tool] ?? 1, pts:[toVirtual(ev)] };
    armHold();
  });
  canvas.addEventListener("pointermove", ev=>{
    if(!state.editing || !state.drawing) return;
    if(state.tool === "er"){ eraseNear(...toVirtual(ev).slice(0,2)); return; }
    const v = toVirtual(ev);

    if(straight){
      /* 이미 직선으로 바뀐 뒤 — 끝점만 따라간다. 잔상이 남지 않게 전체를 다시 그린다 */
      state.cur.pts[1] = v;
      redraw(); paintStroke(state.cur);
      return;
    }
    const last = state.cur.pts[state.cur.pts.length-1];
    state.cur.pts.push(v);
    paintStroke(state.cur); // 진행 중인 획을 즉시 눈에 보이게
    /* 실제로 움직였을 때만 대기 시간을 리셋한다 — 손을 멈추면 그때부터 1초를 센다 */
    if(Math.hypot(v[0]-last[0], v[1]-last[1]) > HOLD_MOVE) armHold();
  });
  function finish(){
    clearHold();
    /* 펜 지우개로 잠시 바뀌었으면 손을 떼는 순간 원래 도구로 돌려놓는다.
       state.drawing 검사보다 앞에 둔다 — 아무것도 못 지운 채 떼도 되돌아와야 한다. */
    const back = () => {
      if(!penErase) return;
      state.tool = penErase; penErase = null;
      markTool(state.tool); syncPointer(); syncOpa();
      toast(TOOLNAME[state.tool] + "으로 돌아왔습니다");
    };
    if(!state.drawing){ back(); return; }
    state.drawing = false;
    straight = false;
    if(state.tool === "er"){ back(); return; }   /* 지우개로 끝난 획도 원래 도구로 되돌린다 */
    if(state.cur && state.cur.pts.length >= 2){
      if(state.tool === "ul"){
        const pts = state.cur.pts;
        const y = pts.reduce((s,p)=>s+p[1],0)/pts.length;
        state.cur.pts = [[pts[0][0], y],[pts[pts.length-1][0], y]];
      }
      ensureAnno().strokes.push(state.cur);
      redraw();
      saveAnnotation(qid);
    }
    state.cur = null;
  }
  canvas.addEventListener("pointerup", finish);
  canvas.addEventListener("pointercancel", finish);
  /* 지우개일 때는 캔버스를 잠깐 벗어나도 계속 지우게 두지만,
     펜 뒤꼭지로 잠시 지우개가 된 상태라면 반드시 finish 를 거쳐 원래 도구로 돌아와야 한다. */
  canvas.addEventListener("pointerleave", ()=>{ if(state.tool!=="er" || penErase) finish(); });

  /* ── 도구 전환 ──
     "move"(이동) 는 그리는 도구가 아니라 손도구다. 이때는 캔버스가 아예 터치를 안 받게 해서
     (pointer-events:none) 필기 모드에 들어와 있어도 평소처럼 세로 스크롤·좌우 넘기기·핀치 확대가
     그대로 되고, 확대돼 있으면 한 손가락으로 화면을 끌어 옮길 수 있다. */
  function syncPointer(){
    const drawing = state.editing && state.tool !== "move";
    canvas.style.pointerEvents = drawing ? "auto" : "none";
    canvas.classList.toggle("edit", drawing);
    zoomCtl?.setPan(state.editing && state.tool === "move");
  }
  function setTool(name){
    if(!name) return;
    penErase = null;          /* 손으로 도구를 고른 순간, 펜 지우개 임시 상태는 없던 일로 */
    state.tool = name;
    tools.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on", x.dataset.tool===name));
    clearHold();
    if(state.drawing){ state.drawing = false; state.cur = null; straight = false; redraw(); }
    syncPointer();
    syncOpa();
  }
  tools.querySelectorAll("[data-tool]").forEach(b=>{
    b.onclick = ()=> setTool(b.dataset.tool);
  });

  /* 진하기 슬라이더 — 도구별로 값을 따로 기억하고, 도구를 바꾸면 그 도구의 값을 다시 보여준다.
     이미 그린 획은 건드리지 않는다(획마다 그릴 때의 진하기가 저장돼 있다). */
  const opaEl = tools.querySelector("[data-opa]");
  const opaVal = tools.querySelector("[data-opaval]");
  function syncOpa(){
    if(!opaEl) return;
    const t = (state.tool === "er") ? "pen" : state.tool;   // 지우개엔 진하기가 없다
    const v = Math.round((state.opa[t] ?? 1) * 100);
    opaEl.value = v;
    if(opaVal) opaVal.textContent = v + "%";
    opaEl.disabled = state.tool === "er";
    tools.querySelector(".itopa")?.style.setProperty("opacity", state.tool === "er" ? ".45" : "1");
  }
  opaEl?.addEventListener("input", ()=>{
    const t = (state.tool === "er") ? "pen" : state.tool;
    state.opa[t] = (+opaEl.value) / 100;
    if(opaVal) opaVal.textContent = opaEl.value + "%";
  });
  tools.querySelectorAll("[data-color]").forEach(b=>{
    b.style.background = b.dataset.color;
    b.onclick = ()=>{
      if(b.dataset.kind === "hi") state.hiColor = b.dataset.color; else state.color = b.dataset.color;
      tools.querySelectorAll(`[data-kind="${b.dataset.kind}"]`).forEach(x=>x.classList.toggle("on", x===b));
    };
  });
  tools.querySelector("[data-undo]").onclick = ()=>{
    const a = ensureAnno(); a.strokes.pop(); redraw(); saveAnnotation(qid);
  };
  tools.querySelector("[data-clear]").onclick = ()=>{
    if(!confirm("이 문항의 필기를 전부 지울까요?")) return;
    ensureAnno().strokes = []; redraw(); saveAnnotation(qid);
  };
  tools.querySelector("[data-close]").onclick = ()=> setEditing(false);

  /* silent=true 면 바깥에 알리지 않는다.
     처음 만들 때의 setEditing(false) 까지 바깥에 전해지면, "필기가 없으면 원래 카드로 되돌리기"가
     곧바로 발동해서 방금 만든 필기 페이지를 도로 부숴버린다. 초기화는 조용히 지나가야 한다. */
  function setEditing(on, silent){
    state.editing = on && S.loggedIn;
    tools.style.display = state.editing ? "flex" : "none";
    wrap.closest(".slide")?.classList.toggle("ink-editing", state.editing);
    if(!state.editing) zoomCtl?.setPan(false);
    syncPointer();
    if(!silent) onEditingChange?.(state.editing);
  }
  setEditing(false, true);
  syncOpa();
  resize();

  return { setEditing, setTool, redraw, resize, get editing(){ return state.editing; } };
}

/* 문항+해설 영역을 핀치 확대 가능한 컨테이너로 감싼다. 필기 있든 없든 공통으로 쓴다 */

/* ── 테마 ── */
const applyTheme = t=>{
  document.documentElement.dataset.theme = t;
  $("meta[name=theme-color]").content = t==="dark" ? "#0E1520" : "#E9ECE6";
};
applyTheme(LS.get("theme", matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("#theme").onclick = ()=>{
  const t = document.documentElement.dataset.theme==="dark" ? "light":"dark";
  applyTheme(t); LS.set("theme",t);
};

/* ── 아주 작은 마크다운 (LaTeX 안 건드림) ── */
/* GFM 스타일 파이프 표(| a | b |\n|---|---|\n| 1 | 2 |) 를 인식해서 <table> 로 바꾼다.
   표가 아니면 null 을 돌려주므로, 호출하는 쪽에서 표가 아닌 다른 처리로 넘어간다. */
function tryTable(block){
  const lines = block.split("\n").filter(l => l.trim());
  if(lines.length < 2) return null;
  const isRow = l => /^\s*\|/.test(l);
  if(!isRow(lines[0])) return null;
  if(!/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[1]) || !/-{2,}/.test(lines[1])) return null;
